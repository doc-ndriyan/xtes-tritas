                <option value="PG_KOMPLEKS" ${qType === 'PG_KOMPLEKS' ? 'selected' : ''}>Pilihan Ganda Kompleks</option>
                <option value="BENAR_SALAH" ${qType === 'BENAR_SALAH' ? 'selected' : ''}>Benar / Salah Majemuk</option>
                <option value="MENJODOHKAN" ${qType === 'MENJODOHKAN' ? 'selected' : ''}>Menjodohkan</option>
                <option value="ISIAN" ${qType === 'ISIAN' ? 'selected' : ''}>Isian Singkat</option>
                <option value="ESAI" ${qType === 'ESAI' ? 'selected' : ''}>Uraian / Esai</option>
              </select>
            </div>
            <div class="space-y-1">
              <label class="text-xs font-semibold text-slate-700">Elemen CP</label>
              <select id="qe-element" class="w-full p-2.5 rounded-lg border border-slate-300 bg-white">
                ${elementsList.map(el => `<option value="${pxEsc(el)}" ${qElement === el ? 'selected' : ''}>${pxEsc(el)}</option>`).join('')}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-700">Bobot</label>
                <input type="number" id="qe-weight" min="1" max="50" value="${qWeight}" class="w-full p-2.5 rounded-lg border border-slate-300 font-mono-code font-bold text-center">
              </div>
              <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-700">Status</label>
                <select id="qe-included" class="w-full p-2.5 rounded-lg border border-slate-300 bg-white font-semibold">
                  <option value="true" ${qIncluded ? 'selected' : ''}>Aktif</option>
                  <option value="false" ${!qIncluded ? 'selected' : ''}>Cadangan</option>
                </select>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="space-y-1">
              <label class="text-xs font-semibold text-slate-700">Topik / Lingkup Materi</label>
              <input type="text" id="qe-topic" required value="${pxEsc(qTopic)}" placeholder="Contoh: Pencarian Biner & Big-O" class="w-full p-2.5 rounded-lg border border-slate-300">
            </div>
            <div class="space-y-1">
              <label class="text-xs font-semibold text-slate-700">Capaian Pembelajaran (CP)</label>
              <input type="text" id="qe-cp" value="${pxEsc(qCp)}" placeholder="CP Fase E/F..." class="w-full p-2.5 rounded-lg border border-slate-300 text-xs">
            </div>
            <div class="space-y-1">
              <label class="text-xs font-semibold text-slate-700">Alur Tujuan Pembelajaran (ATP)</label>
              <input type="text" id="qe-atp" value="${pxEsc(qAtp)}" placeholder="Kode & deskripsi ATP..." class="w-full p-2.5 rounded-lg border border-slate-300 text-xs">
            </div>
          </div>

          <div class="space-y-1">
            <div class="flex items-center justify-between">
              <label class="text-xs font-semibold text-slate-700">Stimulus Kode Program / Cuplikan Teks (Opsional)</label>
              <span class="text-[11px] text-slate-400 font-mono-code">Python / SQL / Pseudocode</span>
            </div>
            <textarea id="qe-stimulus-code" rows="3" placeholder="Tempel potongan kode program jika soal memerlukan stimulus..." class="w-full p-2.5 rounded-lg border border-slate-300 bg-slate-950 text-emerald-300 font-mono-code text-xs">${pxEsc(qCodeStimulus)}</textarea>
          </div>

          <div class="space-y-1">
            <div class="flex items-center justify-between">
              <label class="text-xs font-semibold text-slate-700">Redaksi Pertanyaan (Mendukung LaTeX $...$)</label>
              <button type="button" onclick="refreshQuestionLatexPreview()" class="text-[11px] font-semibold text-[#1E3A5F] hover:underline">Pratinjau Rumus &rarr;</button>
            </div>
            <textarea id="qe-prompt" rows="3" required oninput="refreshQuestionLatexPreview()" placeholder="Tuliskan pertanyaan soal secara jelas..." class="w-full p-2.5 rounded-lg border border-slate-300 leading-relaxed">${pxEsc(qPromptPlain)}</textarea>
            <div id="qe-latex-preview" class="p-2.5 rounded-lg bg-slate-50 border border-slate-200 text-xs text-slate-700 min-h-[36px]">
              ${pxEsc(qPromptPlain) || '<span class="text-slate-400 italic">Pratinjau teks &amp; rumus matematika muncul di sini...</span>'}
            </div>
          </div>

          <!-- Dynamic Answer Key Section -->
          <div id="qe-sec-pg" class="space-y-2 p-3.5 rounded-xl bg-slate-50 border border-slate-300 ${qType === 'PG' || qType === 'PG_KOMPLEKS' ? '' : 'hidden'}">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-800">Pilihan Jawaban (Opsi A – E)</span>
              <span id="qe-pg-hint" class="text-[11px] font-semibold text-[#1E3A5F]">
                ${qType === 'PG' ? 'Pilih 1 kunci jawaban benar' : 'Centang 2 atau lebih kunci jawaban benar'}
              </span>
            </div>
            ${['A', 'B', 'C', 'D', 'E'].map(k => `
              <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded bg-white border border-slate-300 font-mono-code font-bold text-xs flex items-center justify-center shrink-0">${k}</span>
                <input type="text" id="qe-opt-${k}" value="${pxEsc(optMap[k] || '')}" placeholder="Teks opsi ${k} ${k === 'E' ? '(opsional)' : ''}" class="flex-1 p-2 rounded-lg border border-slate-300 bg-white text-xs">
                <label class="qe-single-key flex items-center gap-1 text-xs font-semibold text-emerald-800 whitespace-nowrap ${qType === 'PG' ? '' : 'hidden'}">
                  <input type="radio" name="qe-pg-key" value="${k}" ${keyPg === k ? 'checked' : ''} class="accent-emerald-700"> Kunci
                </label>
                <label class="qe-multi-key flex items-center gap-1 text-xs font-semibold text-emerald-800 whitespace-nowrap ${qType === 'PG_KOMPLEKS' ? '' : 'hidden'}">
                  <input type="checkbox" class="qe-pgk-key accent-emerald-700" value="${k}" ${keysPgK.includes(k) ? 'checked' : ''}> Benar
                </label>
              </div>
            `).join('')}
          </div>

          <div id="qe-sec-bs" class="space-y-2 p-3.5 rounded-xl bg-slate-50 border border-slate-300 ${qType === 'BENAR_SALAH' ? '' : 'hidden'}">
            <div class="text-xs font-bold text-slate-800">Daftar Pernyataan &amp; Kunci Benar / Salah</div>
            ${[0, 1, 2].map(i => `
              <div class="flex items-center gap-2">
                <span class="font-mono-code font-bold text-xs w-5">${i + 1}.</span>
                <input type="text" id="qe-bs-text-${i}" value="${pxEsc((bsRows[i] || {}).text || '')}" placeholder="Pernyataan ke-${i + 1}..." class="flex-1 p-2 rounded-lg border border-slate-300 bg-white text-xs">
                <select id="qe-bs-ans-${i}" class="p-2 rounded-lg border border-slate-300 bg-white text-xs font-semibold">
                  <option value="Benar" ${(bsRows[i] || {}).answer === 'Benar' ? 'selected' : ''}>Benar</option>
                  <option value="Salah" ${(bsRows[i] || {}).answer === 'Salah' ? 'selected' : ''}>Salah</option>
                </select>
              </div>
            `).join('')}
          </div>

          <div id="qe-sec-jodoh" class="space-y-2 p-3.5 rounded-xl bg-slate-50 border border-slate-300 ${qType === 'MENJODOHKAN' ? '' : 'hidden'}">
            <div class="text-xs font-bold text-slate-800">Pasangan Premis Kiri &amp; Jawaban Kanan</div>
            ${[0, 1, 2].map(i => `
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <input type="text" id="qe-pair-l-${i}" value="${pxEsc((pairRows[i] || {}).left || '')}" placeholder="Premis kiri #${i + 1}..." class="p-2 rounded-lg border border-slate-300 bg-white text-xs">
                <input type="text" id="qe-pair-r-${i}" value="${pxEsc((pairRows[i] || {}).right || '')}" placeholder="Pasangan kanan #${i + 1}..." class="p-2 rounded-lg border border-slate-300 bg-white text-xs font-semibold">
              </div>
            `).join('')}
            <div class="pt-1">
              <input type="text" id="qe-pair-distractor" value="${pxEsc(extraDistractor)}" placeholder="Opsi pengecoh tambahan (pisahkan dengan koma, opsional)" class="w-full p-2 rounded-lg border border-slate-300 bg-white text-xs">
            </div>
          </div>

          <div id="qe-sec-isian" class="space-y-2 p-3.5 rounded-xl bg-slate-50 border border-slate-300 ${qType === 'ISIAN' ? '' : 'hidden'}">
            <div class="text-xs font-bold text-slate-800">Kunci Jawaban Isian Singkat</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <input type="text" id="qe-isian-key" value="${pxEsc(shortAnsVal)}" placeholder="Jawaban utama (contoh: 47)" class="p-2 rounded-lg border border-slate-300 bg-white font-mono-code font-bold text-xs">
              <input type="text" id="qe-isian-variants" value="${pxEsc(shortVariantsVal)}" placeholder="Variasi diterima dipisah koma (47, 47.0)" class="p-2 rounded-lg border border-slate-300 bg-white font-mono-code text-xs">
            </div>
          </div>

          <div id="qe-sec-esai" class="space-y-2 p-3.5 rounded-xl bg-slate-50 border border-slate-300 ${qType === 'ESAI' ? '' : 'hidden'}">
            <div class="text-xs font-bold text-slate-800">Pedoman Kunci Jawaban &amp; Rubrik Penilaian Esai</div>
            <textarea id="qe-esai-ideal" rows="2" placeholder="Tuliskan jawaban ideal / kode penyelesaian..." class="w-full p-2 rounded-lg border border-slate-300 bg-white text-xs">${pxEsc(idealAnsVal)}</textarea>
            <textarea id="qe-esai-rubric" rows="2" placeholder="Rubrik penskoran bertingkat (Mahir / Cakap / Layak / Baru Berkembang)..." class="w-full p-2 rounded-lg border border-slate-300 bg-white text-xs">${pxEsc(rubricVal)}</textarea>
          </div>

          <div class="flex justify-end gap-2 pt-2 border-t border-slate-200">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-lg btn-sapphire text-xs font-semibold">${isEdit ? 'Simpan Perubahan Soal' : 'Simpan ke Bank Soal'}</button>
          </div>
        </form>
      `, 'max-w-3xl');
      setTimeout(refreshQuestionLatexPreview, 50);
    }

    function switchQuestionEditorType(type) {
      document.getElementById('qe-sec-pg')?.classList.toggle('hidden', !(type === 'PG' || type === 'PG_KOMPLEKS'));
      document.getElementById('qe-sec-bs')?.classList.toggle('hidden', type !== 'BENAR_SALAH');
      document.getElementById('qe-sec-jodoh')?.classList.toggle('hidden', type !== 'MENJODOHKAN');
      document.getElementById('qe-sec-isian')?.classList.toggle('hidden', type !== 'ISIAN');
      document.getElementById('qe-sec-esai')?.classList.toggle('hidden', type !== 'ESAI');

      document.querySelectorAll('.qe-single-key').forEach(el => el.classList.toggle('hidden', type !== 'PG'));
      document.querySelectorAll('.qe-multi-key').forEach(el => el.classList.toggle('hidden', type !== 'PG_KOMPLEKS'));
      const hint = document.getElementById('qe-pg-hint');
      if (hint) hint.textContent = type === 'PG' ? 'Pilih 1 kunci jawaban benar' : 'Centang 2 atau lebih kunci jawaban benar';
    }

    function refreshQuestionLatexPreview() {
      const promptEl = document.getElementById('qe-prompt');
      const prevEl = document.getElementById('qe-latex-preview');
      if (!promptEl || !prevEl) return;
      const raw = promptEl.value.trim();
      prevEl.innerHTML = raw ? `<p>${pxEsc(raw)}</p>` : '<span class="text-slate-400 italic">Pratinjau teks &amp; rumus matematika muncul di sini...</span>';
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([prevEl]).catch(() => {});
      }
    }

    function saveQuestionForm(e, editId) {
      e.preventDefault();
      const teacherAcc = getCurrentTeacherAccount();
      const activePkg = getActiveTeacherPackage(teacherAcc);
      const type = document.getElementById('qe-type').value;
      const element = document.getElementById('qe-element').value;
      const weight = Math.max(1, Number(document.getElementById('qe-weight').value) || 10);
      const included = document.getElementById('qe-included').value === 'true';
      const topic = document.getElementById('qe-topic').value.trim();
      const cp = document.getElementById('qe-cp').value.trim();
      const atp = document.getElementById('qe-atp').value.trim();
      const promptRaw = document.getElementById('qe-prompt').value.trim();
      const codeStimulus = document.getElementById('qe-stimulus-code').value.trim();

      const typeLabels = {
        PG: 'Pilihan Ganda',
        PG_KOMPLEKS: 'Pilihan Ganda Kompleks',
        BENAR_SALAH: 'Benar / Salah Majemuk',
        MENJODOHKAN: 'Menjodohkan',
        ISIAN: 'Isian Singkat',
        ESAI: 'Uraian / Esai'
      };

      const existing = editId ? state.questions.find(item => item.id === editId) : null;
      const qObj = existing || {
        id: 'Q' + (state.questions.length + 1) + '_' + Date.now().toString().slice(-3),
        number: state.questions.length + 1,
        packageId: activePkg ? activePkg.id : 'PKG-GUR-01',
        ownerId: teacherAcc ? teacherAcc.id : 'GUR-01',
        ownerName: teacherAcc ? teacherAcc.name : state.examConfig.teacher,
        subject: activePkg ? activePkg.subject : state.examConfig.subject,
        grade: activePkg ? activePkg.grade : state.examConfig.grade
      };

      qObj.type = type;
      qObj.typeLabel = typeLabels[type] || 'Pilihan Ganda';
      qObj.element = element;
      qObj.weight = weight;
      const prevIncluded = existing ? !!existing.included : null;
      qObj.included = included;
      if (state.currentRole === 'admin') {
        if (prevIncluded === null || prevIncluded !== included) qObj.adminDisabled = !included;
      } else if (qObj.adminDisabled) {
        qObj.included = false;
      }
      qObj.topic = topic;
      qObj.cp = cp;
      qObj.atp = atp;
      qObj.tp = atp || topic;
      qObj.formattedPrompt = `<p>${pxEsc(promptRaw)}</p>`;

      if (codeStimulus) {
        qObj.stimulusHtml = `
          <div class="rounded-xl overflow-hidden border border-slate-700/90 bg-slate-950 shadow-sm">
            <div class="px-3.5 py-2 bg-slate-900 border-b border-slate-800 flex items-center justify-between text-xs font-mono-code text-slate-300">
              <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> stimulus_kode</span>
              <span class="text-sky-400">${pxEsc(qObj.id)}</span>
            </div>
            <pre class="p-3.5 text-emerald-300 font-mono-code text-xs overflow-x-auto leading-relaxed"><code>${pxEsc(codeStimulus)}</code></pre>
          </div>
        `;
      } else {
        delete qObj.stimulusHtml;
      }

      if (type === 'PG' || type === 'PG_KOMPLEKS') {
        const opts = [];
        ['A', 'B', 'C', 'D', 'E'].forEach(k => {
          const val = (document.getElementById(`qe-opt-${k}`)?.value || '').trim();
          if (val) opts.push({ key: k, text: pxEsc(val) });
        });
        qObj.options = opts.length >= 2 ? opts : [{ key: 'A', text: 'Opsi A' }, { key: 'B', text: 'Opsi B' }];
        if (type === 'PG') {
          const checkedRadio = document.querySelector('input[name="qe-pg-key"]:checked');
          qObj.correctKey = checkedRadio ? checkedRadio.value : qObj.options[0].key;
        } else {
          const checkedBoxes = [...document.querySelectorAll('.qe-pgk-key:checked')].map(el => el.value);
          qObj.correctKeys = checkedBoxes.length > 0 ? checkedBoxes : [qObj.options[0].key];
        }
      } else if (type === 'BENAR_SALAH') {
        const stmts = [];
        [0, 1, 2].forEach(i => {
          const txt = (document.getElementById(`qe-bs-text-${i}`)?.value || '').trim();
          const ans = document.getElementById(`qe-bs-ans-${i}`)?.value || 'Benar';
          if (txt) stmts.push({ id: `S${i + 1}`, text: pxEsc(txt), answer: ans });
        });
        qObj.statements = stmts.length > 0 ? stmts : [{ id: 'S1', text: 'Pernyataan 1', answer: 'Benar' }];
      } else if (type === 'MENJODOHKAN') {
        const pairs = [];
        [0, 1, 2].forEach(i => {
          const l = (document.getElementById(`qe-pair-l-${i}`)?.value || '').trim();
          const r = (document.getElementById(`qe-pair-r-${i}`)?.value || '').trim();
          if (l && r) pairs.push({ id: `P${i + 1}`, left: pxEsc(l), right: r });
        });
        qObj.pairs = pairs.length > 0 ? pairs : [{ id: 'P1', left: 'Premis 1', right: 'Pasangan 1' }];
        const extra = (document.getElementById('qe-pair-distractor')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
        qObj.distractorChoices = [...new Set([...qObj.pairs.map(p => p.right), ...extra])];
      } else if (type === 'ISIAN') {
        const mainKey = (document.getElementById('qe-isian-key')?.value || '').trim() || '-';
        const vars = (document.getElementById('qe-isian-variants')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
        qObj.correctText = mainKey;
        qObj.acceptedVariants = vars.length > 0 ? vars : [mainKey];
      } else if (type === 'ESAI') {
        qObj.idealAnswer = (document.getElementById('qe-esai-ideal')?.value || '').trim();
        qObj.rubric = (document.getElementById('qe-esai-rubric')?.value || '').trim();
      }

      if (!existing) {
        state.questions.push(qObj);
        pxLog('Tambah Butir Soal', `${qObj.id} (${qObj.typeLabel})`, qObj.topic, null);
      } else {
        pxLog('Edit Butir Soal', `${qObj.id} (${qObj.typeLabel})`, qObj.topic, null);
      }

      const syncPkg = state.examPackages.find(pk => pk.id === qObj.packageId) || activePkg;
      if (syncPkg) syncPackageAcrossSystem(syncPkg, { activateForStudents: false, silent: true });
      closeModal();
      pxSaveImmediate();
      renderApp();
      showToast(existing ? 'Perubahan Disimpan' : 'Soal Ditambahkan', `Butir soal ${qObj.id} berhasil disimpan ke paket ujian.`, 'success');
    }

    function importFullBackupJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          const data = parsed.data || parsed;
          if (!data || !Array.isArray(data.students)) throw new Error('Format tidak valid');
          PX_KEYS.forEach(k => { if (data[k] !== undefined) state[k] = data[k]; });
          pxLog('Pemulihan Database JSON', file.name, 'Restore berhasil', null);
          pxSaveImmediate();
          renderApp();
          showToast('Pemulihan Berhasil', 'Database sistem telah dipulihkan dari file cadangan.', 'success');
        } catch (err) {
          showToast('Gagal Memulihkan JSON', 'Pastikan berkas berasal dari fitur Unduh Backup JSON.', 'danger');
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    }

      var out = [], cur = [], size = 0;
      items.forEach(function (it) {
        var n = it.data ? (JSON.stringify(it.data, rep) || '').length : 20;
        if (cur.length && (size + n > 700000 || cur.length >= 150)) { out.push(cur); cur = []; size = 0; }
        cur.push(it); size += n;
      });
      if (cur.length) out.push(cur);
      return out;
    }

    function pushAll() {
      var items = buildDiff();
      if (!items.length) return Promise.resolve(0);
      var bs = batches(items), total = 0;
      return bs.reduce(function (p, batch) {
        return p.then(function () {
          var ch = {};
          batch.forEach(function (it) {
            (ch[it.c] = ch[it.c] || []).push(it.deleted ? { id: it.id, deleted: true } : { id: it.id, data: it.data });
          });
          return post({ action: 'push', changes: ch }).then(function (r) {
            if (!r || !r.ok) throw new Error((r && r.error) || 'push gagal');
            batch.forEach(function (it) {
              if (it.c === 'audit') { meta.a[it.id] = 1; return; }
              meta.h[it.c] = meta.h[it.c] || {};
              if (it.deleted) delete meta.h[it.c][it.id]; else meta.h[it.c][it.id] = it.h;
            });
            if (r.cursor && r.cursor > meta.cursor) { /* cursor diambil dari pull berikutnya */ }
            total += batch.length; saveMeta();
          });
        });
      }, Promise.resolve()).then(function () { return total; });
    }

    // ---------- APPLY (server -> lokal) ----------
    function applyRemote(changes) {
      var s = S(); if (!s || !changes) return false;
      var changed = false, ownId = examLive() ? s.studentSession.studentId : null;

      ARR.forEach(function (c) {
        var list = changes[c]; if (!list || !list.length) return;
        if (!Array.isArray(s[c])) s[c] = [];
        meta.h[c] = meta.h[c] || {};
        var mh = meta.h[c], idx = {};
        s[c].forEach(function (r, i) { if (r && r.id !== undefined) idx[String(r.id)] = i; });
        var removeIds = {};
        list.forEach(function (rm) {
          var id = String(rm.id), i = idx[id], local = (i !== undefined) ? s[c][i] : null;
          if (c === 'students' && ownId && id === ownId) return;           // jangan timpa jawaban yang sedang dikerjakan
          var localModified = local && mh[id] !== undefined && hs(local) !== mh[id];
          if (localModified) return;                                        // perubahan lokal menang, akan di-push
          if (rm.deleted) {
            if (local) { removeIds[id] = 1; changed = true; }
            delete mh[id];
          } else if (rm.data) {
            if (local && hs(local) === hs(rm.data)) { mh[id] = hs(rm.data); return; }
            if (local) s[c][i] = rm.data; else { s[c].push(rm.data); idx[id] = s[c].length - 1; }
            mh[id] = hs(rm.data); changed = true;
          }
        });
        if (Object.keys(removeIds).length) s[c] = s[c].filter(function (r) { return !(r && removeIds[String(r.id)]); });
      });

      if (changes.kv && changes.kv.length) {
        meta.h.kv = meta.h.kv || {};
        changes.kv.forEach(function (rm) {
          if (rm.deleted || !rm.data || KV.indexOf(rm.id) < 0) return;
          var cur = { v: s[rm.id] === undefined ? null : s[rm.id] };
          var localModified = meta.h.kv[rm.id] !== undefined && hs(cur) !== meta.h.kv[rm.id];
          if (localModified) return;
          if (hs(cur) !== hs(rm.data)) { s[rm.id] = rm.data.v; changed = true; }
          meta.h.kv[rm.id] = hs(rm.data);
        });
      }

      if (changes.audit && changes.audit.length) {
        var have = {}; (s.auditLog || []).forEach(function (e) { have[auditId(e)] = 1; });
        changes.audit.forEach(function (rm) {
          if (!rm.data) return;
          meta.a[rm.id] = 1;
          if (!have[rm.id]) { s.auditLog.push(rm.data); changed = true; }
        });
        s.auditLog.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
        if (s.auditLog.length > 500) s.auditLog.length = 500;
        try { localStorage.setItem('tritas_cbt_audit_v2', JSON.stringify(s.auditLog)); } catch (e) {}
      }

      if (changed) {
        try { if (typeof sortStudentsByName === 'function') s.students = sortStudentsByName(s.students); } catch (e) {}
        try { pxSaveImmediate(); } catch (e) {}
      }
      return changed;
    }

    function safeRender() {
      try {
        if (examLive()) return;
        var ae = document.activeElement;
        if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
        var mb = document.getElementById('modal-backdrop');
        if (mb && !mb.classList.contains('hidden')) return;
        if (typeof renderApp === 'function') renderApp();
      } catch (e) {}
    }

    function pullAll() {
      return post({ action: 'pull', since: meta.cursor }).then(function (r) {
        if (!r || !r.ok) throw new Error((r && r.error) || 'pull gagal');
        var changed = r.empty ? false : applyRemote(r.changes);
        if (typeof r.cursor === 'number' && r.cursor >= meta.cursor) meta.cursor = r.cursor;
        saveMeta();
        if (changed) safeRender();
        return changed;
      });
    }

    // ---------- penjadwal ----------
    var busy = false, dirty = false, pushT = 0, lastRun = 0, fails = 0, lastOk = 0, lastErr = '';

    function stamp() {
      try { S().lastSyncedAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); } catch (e) {}
    }

    function syncNow() {
      if (!enabled() || (typeof navigator !== 'undefined' && navigator.onLine === false)) return Promise.resolve();
      if (busy) { dirty = true; return Promise.resolve(); }
      busy = true; lastRun = Date.now();
      var p = Promise.resolve();
      if (!examLive()) p = p.then(pullAll);            // saat ujian: hanya kirim, tidak menarik
      return p.then(pushAll).then(function () {
        fails = 0; lastOk = Date.now(); lastErr = ''; stamp();
      }).catch(function (e) {
        fails++; lastErr = String(e && e.message || e);
        clearTimeout(pushT); pushT = setTimeout(syncNow, Math.min(60000, 4000 * fails));
      }).then(function () {
        busy = false;
        if (dirty) { dirty = false; schedulePush(); }
      });
    }

    function schedulePush() {
      if (!enabled()) return;
      clearTimeout(pushT);
      pushT = setTimeout(syncNow, 1800);
    }

    // ---------- kait (hook) ke fungsi simpan aplikasi ----------
    try {
      var origSave = window.pxSave;
      if (typeof origSave === 'function') {
        window.pxSave = function () { var r = origSave.apply(this, arguments); schedulePush(); return r; };
      }
      var origLog = window.pxLog;
      if (typeof origLog === 'function') {
        window.pxLog = function () { var r = origLog.apply(this, arguments); schedulePush(); return r; };
      }
      var origReset = window.executeFactoryReset;
      if (typeof origReset === 'function') {
        window.executeFactoryReset = function () {
          try { localStorage.removeItem(LS_META); } catch (e) {}
          return origReset.apply(this, arguments);
        };
      }
    } catch (e) {}

    // Polling ringan: admin/guru 15 dtk, siswa 60 dtk (respons server instan bila tak ada perubahan)
    setInterval(function () {
      if (!enabled() || document.hidden || busy) return;
      var s = S(), every = (s && s.currentRole === 'siswa') ? 60000 : 15000;
      if (Date.now() - lastRun >= every) syncNow();
    }, 5000);

    window.addEventListener('online', function () { syncNow(); });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) syncNow();
      else if (enabled()) flushBeacon();
    });
    window.addEventListener('pagehide', function () { if (enabled()) flushBeacon(); });

    // Kirim sisa perubahan saat tab ditutup (mis. siswa menutup browser setelah submit)
    function flushBeacon() {
      try {
        if (!navigator.sendBeacon) return;
        var items = buildDiff().filter(function (i) { return !i.deleted; });
        if (!items.length) return;
        var ch = {}, size = 0;
        for (var i = 0; i < items.length; i++) {
          var n = (JSON.stringify(items[i].data, rep) || '').length;
          if (size + n > 55000) break;
          size += n; (ch[items[i].c] = ch[items[i].c] || []).push({ id: items[i].id, data: items[i].data });
        }
        if (!size) return;
        navigator.sendBeacon(GAS_URL, new Blob([JSON.stringify({ action: 'push', key: GAS_KEY, changes: ch }, rep)], { type: 'text/plain;charset=utf-8' }));
      } catch (e) {}
    }

    // ---------- API untuk Console ----------
    window.TritasSync = {
      now: syncNow,
      status: function () { return { aktif: enabled(), sibuk: busy, cursor: meta.cursor, sukses_terakhir: lastOk ? new Date(lastOk).toLocaleString('id-ID') : '-', galat_terakhir: lastErr || '-', antrean: enabled() ? buildDiff().length : 0 }; },
      setUrl: function (url, key) {
        try { localStorage.setItem(LS_URL, url || ''); localStorage.setItem(LS_KEY, key || ''); } catch (e) {}
        GAS_URL = url || ''; GAS_KEY = key || ''; meta = { cursor: 0, h: {}, a: {} }; saveMeta(); return syncNow();
      },
      resetLokalMeta: function () { meta = { cursor: 0, h: {}, a: {} }; saveMeta(); },
      resetServer: function () { return post({ action: 'reset' }); }
    };

    // Mulai di latar belakang setelah UI tampil
    if (enabled()) setTimeout(syncNow, 400);
  })();
  </script>
</body>
