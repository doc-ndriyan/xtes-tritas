    function renderGuruKoreksi() {
      const teacherAcc = getCurrentTeacherAccount();
      const pool = getTeacherQuestions(teacherAcc);
      const essayQuestions = pool.filter(q => q.type === 'ESAI');
      if (essayQuestions.length === 0) {
        return `<div class="studio-card p-8 text-center text-sm text-slate-500">Belum ada butir soal bertipe Uraian / Esai di bank soal Anda.</div>`;
      }

      const activeQ = essayQuestions.find(q => q.id === state.selectedEssayQuestionId) || essayQuestions[0];
      const filterStatus = state.essayFilterStatus || 'ALL';
      const isBlind = !!state.essayBlindGrading;

      const participantsWithExam = sortStudentsByName(pxGuruStudents());
      if (participantsWithExam.length === 0) {
        return `<div class="studio-card p-8 text-center text-xs sm:text-sm text-slate-500">Belum ada peserta didik yang menyelesaikan ujian. Lembar jawaban uraian/esai akan tampil otomatis setelah peserta mengumpulkan ujian.</div>`;
      }

      const filteredStudents = participantsWithExam.filter(st => {
        const sc = st.essayScores ? st.essayScores[activeQ.id] : undefined;
        const isGraded = sc !== undefined && sc !== '';
        if (filterStatus === 'UNGRADED') return !isGraded;
        if (filterStatus === 'GRADED') return isGraded;
        return true;
      });

      const activeStudent = filteredStudents.find(s => s.id === state.selectedEssayStudentId)
        || filteredStudents[0]
        || participantsWithExam[0]
        || state.students[0];

      const currentScore = activeStudent.essayScores && activeStudent.essayScores[activeQ.id] !== undefined ? activeStudent.essayScores[activeQ.id] : '';
      const currentFeedback = (activeStudent.essayFeedbacks && activeStudent.essayFeedbacks[activeQ.id]) || '';
      const gradedCount = participantsWithExam.filter(st => st.essayScores && st.essayScores[activeQ.id] !== undefined && st.essayScores[activeQ.id] !== '').length;
      const studentGradedEssays = essayQuestions.filter(eq => activeStudent.essayScores && activeStudent.essayScores[eq.id] !== undefined && activeStudent.essayScores[eq.id] !== '').length;

      const formatStudentLabel = (st, idx) => {
        if (!isBlind) return `${idx + 1}. ${pxEsc(st.name)}`;
        return `Peserta Anonim #${String(idx + 1).padStart(2, '0')} (${pxEsc(st.id)})`;
      };

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <div class="lg:col-span-4 studio-card p-4 sm:p-5 space-y-4">
            <div class="space-y-1.5">
              <div class="flex items-center justify-between gap-2">
                <label class="block text-xs font-semibold text-slate-700">Butir Esai</label>
                <span class="px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-800 border border-emerald-200 font-mono-code text-[11px] font-bold whitespace-nowrap">
                  Terkoreksi: ${gradedCount}/${participantsWithExam.length}
                </span>
              </div>
              <select onchange="state.selectedEssayQuestionId=this.value; renderApp();" class="w-full p-2.5 rounded-lg border border-slate-300 bg-white text-xs font-semibold">
                ${essayQuestions.map((eq, i) => `<option value="${eq.id}" ${eq.id === activeQ.id ? 'selected' : ''}>Esai #${i + 1} (${eq.id} &bull; Bobot ${eq.weight})</option>`).join('')}
              </select>
            </div>

            <label class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-300 cursor-pointer text-xs gap-3">
              <div>
                <div class="font-bold text-slate-800 flex items-center gap-1.5">
                  <i data-lucide="eye-off" class="w-3.5 h-3.5 text-[#1E3A5F]"></i>
                  <span>Mode Blind-Grading (Anonim)</span>
                </div>
                <div class="text-[11px] text-slate-500">Sembunyikan nama &amp; NIS saat mengoreksi</div>
              </div>
              <input type="checkbox" ${isBlind ? 'checked' : ''} onchange="state.essayBlindGrading=this.checked; renderApp();" class="w-4 h-4 accent-[#1E3A5F] shrink-0">
            </label>

            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-1.5">
              <div class="font-semibold text-slate-900">Kunci &amp; Rubrik Penilaian:</div>
              <p class="text-slate-600 leading-relaxed">${pxEsc(activeQ.idealAnswer || '-')}</p>
              ${activeQ.rubric ? `<p class="text-[11px] text-slate-500 border-t border-slate-200 pt-1.5">${pxEsc(activeQ.rubric)}</p>` : ''}
            </div>

            <div class="grid grid-cols-3 gap-1 p-1 rounded-lg bg-slate-100 border border-slate-300 text-[11px] font-semibold">
              <button type="button" onclick="state.essayFilterStatus='ALL'; renderApp();"
                class="py-1 rounded transition ${filterStatus === 'ALL' ? 'bg-[#1E3A5F] text-white' : 'text-slate-700'}">Semua (${participantsWithExam.length})</button>
              <button type="button" onclick="state.essayFilterStatus='UNGRADED'; renderApp();"
                class="py-1 rounded transition ${filterStatus === 'UNGRADED' ? 'bg-amber-700 text-white' : 'text-slate-700'}">Belum</button>
              <button type="button" onclick="state.essayFilterStatus='GRADED'; renderApp();"
                class="py-1 rounded transition ${filterStatus === 'GRADED' ? 'bg-emerald-700 text-white' : 'text-slate-700'}">Selesai</button>
            </div>

            <div class="max-h-64 overflow-y-auto space-y-1.5">
              ${filteredStudents.length === 0 ? `<div class="p-4 text-center text-xs text-slate-400">Tidak ada peserta pada filter ini.</div>` : filteredStudents.map((st, idx) => {
                const sc = st.essayScores ? st.essayScores[activeQ.id] : undefined;
                const isGraded = sc !== undefined && sc !== '';
                const totalStudentGraded = essayQuestions.filter(eq => st.essayScores && st.essayScores[eq.id] !== undefined && st.essayScores[eq.id] !== '').length;
                return `
                  <button type="button" onclick="state.selectedEssayStudentId='${st.id}'; renderApp();"
                    class="w-full p-2.5 rounded-lg border text-left text-xs flex items-center justify-between gap-2 ${st.id === activeStudent.id ? 'border-[#1E3A5F] bg-[#EFF4F9] font-semibold' : 'border-slate-200 hover:bg-slate-50'}">
                    <div class="min-w-0">
                      <div class="truncate">${formatStudentLabel(st, idx)}</div>
                      <div class="text-[10px] font-mono-code text-slate-500">Total Esai: ${totalStudentGraded}/${essayQuestions.length} butir</div>
                    </div>
                    <span class="font-mono-code px-2 py-0.5 rounded text-[11px] shrink-0 whitespace-nowrap ${isGraded ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-500'}">
                      ${isGraded ? `${sc}/${activeQ.weight}` : 'Belum'}
                    </span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="lg:col-span-8 studio-card p-5 sm:p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-3.5">
              <div>
                <h3 class="font-bold text-base text-slate-900">
                  ${isBlind
                    ? `Peserta Anonim (${pxEsc(activeStudent.id)}) <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-900 text-[11px] font-semibold ml-1">Identitas Disembunyikan</span>`
                    : `${pxEsc(activeStudent.name)} <span class="font-mono-code text-xs text-slate-500">(${pxEsc(activeStudent.nis)})</span>`}
                </h3>
                <span class="text-xs text-slate-500">
                  ${isBlind ? 'Sesi Asesmen Terverifikasi' : `Kelas ${pxEsc(activeStudent.className)}`} &bull;
                  Progres Seluruh Esai Siswa: <strong class="font-mono-code ${studentGradedEssays === essayQuestions.length ? 'text-emerald-700' : 'text-amber-700'}">${studentGradedEssays}/${essayQuestions.length} Selesai</strong>
                </span>
              </div>
              <div class="flex gap-2 text-xs shrink-0">
                <button type="button" onclick="navigateEssayStudent(-1)" class="px-3 py-1.5 rounded-lg border border-slate-300 font-semibold whitespace-nowrap">&larr; Sebelumnya</button>
                <button type="button" onclick="navigateEssayStudent(1)" class="px-3 py-1.5 rounded-lg border border-slate-300 font-semibold whitespace-nowrap">Berikutnya &rarr;</button>
              </div>
            </div>

            <details class="rounded-xl border border-slate-300 bg-slate-50 p-3.5 text-xs">
              <summary class="font-bold text-[#1E3A5F] cursor-pointer select-none">Lihat Redaksi Pertanyaan &amp; Stimulus Soal (${pxEsc(activeQ.id)})</summary>
              <div class="mt-3 space-y-3 border-t border-slate-200 pt-3">
                ${activeQ.stimulusHtml || ''}
                <div class="exam-prompt-body text-slate-800">${activeQ.formattedPrompt}</div>
              </div>
            </details>

            <div class="space-y-1.5">
              <div class="text-xs font-semibold text-slate-700">Lembar Jawaban / Kode Peserta Didik:</div>
              <div class="p-4 rounded-xl bg-slate-950 text-emerald-300 font-mono-code text-xs sm:text-sm whitespace-pre-wrap leading-relaxed border border-slate-800">${activeStudent.answers && activeStudent.answers[activeQ.id] ? pxEsc(activeStudent.answers[activeQ.id]) : '// Peserta tidak mengisi jawaban esai.'}</div>
            </div>

            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-slate-700">Catatan Umpan Balik Guru (Langsung Tampil di Portal Siswa)</label>
              <input type="text" id="essay-feedback-input" value="${pxEsc(currentFeedback)}"
                placeholder="Contoh: Logika slicing benar, namun lupa menambahkan .lower() untuk case-insensitive."
                class="w-full p-2.5 rounded-lg border border-slate-300 text-xs">
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-200">
              <div class="flex flex-wrap gap-1.5 text-xs">
                ${[0, 0.25, 0.5, 0.75, 1].map(ratio => {
                  const val = Math.round(activeQ.weight * ratio);
                  return `<button type="button" onclick="saveEssayScore('${activeStudent.id}', '${activeQ.id}', ${val}, false)" class="px-2.5 py-1.5 rounded-lg border font-mono-code font-semibold whitespace-nowrap ${Number(currentScore) === val && currentScore !== '' ? 'bg-[#1E3A5F] text-white border-[#1E3A5F]' : 'bg-white border-slate-300'}">${val} (${Math.round(ratio * 100)}%)</button>`;
                }).join('')}
              </div>

              <div class="flex items-center gap-2 shrink-0">
                <span class="text-xs text-slate-500 whitespace-nowrap">Maks ${activeQ.weight}:</span>
                <input type="number" id="manual-essay-score" min="0" max="${activeQ.weight}" value="${currentScore}" class="w-16 p-2 rounded-lg border border-slate-300 font-mono-code font-bold text-center text-sm">
                <button type="button" onclick="saveEssayScore('${activeStudent.id}', '${activeQ.id}', document.getElementById('manual-essay-score').value, true)"
                  class="px-4 py-2 rounded-lg btn-sapphire text-xs font-semibold whitespace-nowrap">
                  Simpan &amp; Lanjut &rarr;
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderGuruAnalisis() {
      const analysis = computePsychometricAnalysis();
      const filterMode = state.analysisFilter || 'ALL';
      const displayedItems = analysis.itemStats.filter(item => {
        if (filterMode === 'REVISION') return item.D < 0.20 || !item.isValid;
        if (filterMode === 'VALIDATED') return !!item.question.validated || item.D >= 0.30;
        return true;
      });
      const revisionCount = analysis.itemStats.filter(item => item.D < 0.20 || !item.isValid).length;

      return `
        <div class="space-y-5">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
            <div class="studio-card p-4 space-y-1">
              <div class="text-xs text-slate-500">Reliabilitas Tes (KR-20)</div>
              <div class="text-xl sm:text-2xl font-mono-code font-bold text-slate-900">r₁₁ = ${analysis.reliability}</div>
              <div class="text-xs text-emerald-700 font-medium">${analysis.reliabilityLabel}</div>
            </div>
            <div class="studio-card p-4 space-y-1">
              <div class="text-xs text-slate-500">Indeks Kesukaran (P)</div>
              <div class="text-xl sm:text-2xl font-mono-code font-bold text-slate-900">${analysis.avgP}</div>
              <div class="text-xs text-slate-500">Ideal: 0.30 &ndash; 0.70</div>
            </div>
            <div class="studio-card p-4 space-y-1">
              <div class="text-xs text-slate-500">Daya Pembeda (D)</div>
              <div class="text-xl sm:text-2xl font-mono-code font-bold text-[#1E3A5F]">${analysis.avgD}</div>
              <div class="text-xs text-slate-500">Upper vs Lower 27%</div>
            </div>
            <div class="studio-card p-4 space-y-1">
              <div class="text-xs text-slate-500">Butir Soal Valid</div>
              <div class="text-xl sm:text-2xl font-mono-code font-bold text-slate-900">${analysis.validCount} / ${analysis.itemStats.length}</div>
              <div class="text-xs text-slate-500">Sampel N = ${analysis.N}</div>
            </div>
          </div>

          <div class="studio-card overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 class="font-bold text-sm sm:text-base text-slate-900">Analisis Psikometri &amp; Efektivitas Pengecoh Butir Soal</h3>
                <p class="text-xs text-slate-500">Menampilkan indeks kesukaran (P), daya pembeda (D), validitas butir, serta sebaran pilihan jawaban A–E.</p>
              </div>
              <div class="flex flex-wrap items-center gap-2 text-xs">
                <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-300 font-semibold">
                  <button type="button" onclick="state.analysisFilter='ALL'; renderApp();"
                    class="px-2.5 py-1 rounded-md transition whitespace-nowrap ${filterMode === 'ALL' ? 'bg-[#1E3A5F] text-white' : 'text-slate-700'}">
                    Semua (${analysis.itemStats.length})
                  </button>
                  <button type="button" onclick="state.analysisFilter='REVISION'; renderApp();"
                    class="px-2.5 py-1 rounded-md transition whitespace-nowrap ${filterMode === 'REVISION' ? 'bg-amber-700 text-white' : 'text-slate-700'}">
                    Revisi (${revisionCount})
                  </button>
                  <button type="button" onclick="state.analysisFilter='VALIDATED'; renderApp();"
                    class="px-2.5 py-1 rounded-md transition whitespace-nowrap ${filterMode === 'VALIDATED' ? 'bg-emerald-700 text-white' : 'text-slate-700'}">
                    Unggulan
                  </button>
                </div>
                <button type="button" onclick="exportItemAnalysisXLS()" class="px-3.5 py-2 rounded-lg btn-sapphire text-xs font-semibold inline-flex items-center gap-1.5 whitespace-nowrap">
                  <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>
                  <span>Ekspor (.xls)</span>
                </button>
              </div>
            </div>
            <div class="table-scroll-wrap">
              <table class="cbt-table text-xs sm:text-sm">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                    <th>No</th>
                    <th class="min-w-[200px]">Bentuk, Topik &amp; ATP</th>
                    <th class="text-center">Kesukaran (P)</th>
                    <th class="text-center">Daya Pembeda (D)</th>
                    <th class="text-center">Validitas (r_pbis)</th>
                    <th class="min-w-[175px]">Distribusi Pengecoh (PG)</th>
                    <th class="min-w-[200px]">Keputusan Sistem</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                  ${displayedItems.length === 0 ? `
                    <tr><td colspan="7" class="p-6 text-center text-xs text-slate-500">Tidak ada butir soal pada kategori filter ini.</td></tr>
                  ` : displayedItems.map(item => `
                    <tr>
                      <td class="font-mono-code font-bold whitespace-nowrap">#${item.displayNum}</td>
                      <td>
                        <div class="font-semibold text-slate-900">${pxEsc(item.question.typeLabel)}</div>

    }

    // =========================================================================
    // GURU: HASIL ASESMEN PER KELAS PER ASESMEN / UJIAN
    // =========================================================================
    function pxHasilContext() {
      const acc = getCurrentTeacherAccount();
      const pkgs = getTeacherPackages(acc);
      const pkg = pkgs.find(p => p.id === state.hasilPackageId) || getActiveTeacherPackage(acc) || pkgs[0];
      const classes = sortClassNames([...new Set(state.students.map(s => s.className))]);
      return { pkgs, pkg, classes };
    }

    function pxClassStats(pkg, className) {
      const list = state.students.filter(s => s.className === className);
      const rows = list.map(st => ({ st, res: pxPackageResult(st, pkg) }));
      const started = rows.filter(r => r.res);
      const done = started.filter(r => r.res.status === 'Selesai');
      const scores = done.map(r => r.res.finalScore);
      const passed = done.filter(r => r.res.passed).length;
      return {
        total: list.length,
        started: started.length,
        done: done.length,
        ongoing: started.filter(r => r.res.status === 'Sedang Mengerjakan').length,
        blocked: started.filter(r => r.res.status === 'Terblokir').length,
        notStarted: list.length - started.length,
        avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null,
        max: scores.length ? Math.max(...scores) : null,
        min: scores.length ? Math.min(...scores) : null,
        passed,
        remedial: done.length - passed,
        ungraded: done.filter(r => r.res.hasUngradedEssay).length,
        rows
      };
    }

    function pxHasilSelectedClass(classes, pkg) {
      if (state.hasilClass === 'ALL' || (state.hasilClass && classes.includes(state.hasilClass))) return state.hasilClass;
      const firstWithData = classes.find(c => pxClassStats(pkg, c).started > 0);
      return firstWithData || classes[0] || 'ALL';
    }

    function renderGuruHasil() {

        total: a.total + c.total, done: a.done + c.done, started: a.started + c.started,

        passed: a.passed + c.passed, remedial: a.remedial + c.remedial, ungraded: a.ungraded + c.ungraded

      const allScores = statsByClass.flatMap(c => c.rows.filter(r => r.res && r.res.status === 'Selesai').map(r => r.res.finalScore));

    function exportHasilAsesmenXLS() {
      const { pkg, classes } = pxHasilContext();
      if (!pkg) return;
      const selClass = pxHasilSelectedClass(classes, pkg);
      const list = sortStudentsByName(state.students.filter(s => selClass === 'ALL' || s.className === selClass));
      const rows = [['No', 'NIS', 'NISN', 'Nama_Peserta', 'Kelas', 'Status', 'Durasi', 'Nilai_Awal', 'Nilai_Remedial', 'Nilai_Akhir', 'KKTP', 'Ketuntasan', 'Catatan']];
      list.forEach((st, i) => {
        const res = pxPackageResult(st, pkg);
        const fin = res && res.status === 'Selesai';
        rows.push([
          i + 1, st.nis, st.nisn, st.name, st.className,
          res ? res.status : 'Belum Mengerjakan',
          fin ? res.duration : '-',
          fin ? res.rawScore100 : '-',
          fin && res.remedialScore !== null && res.remedialScore !== undefined ? res.remedialScore : '-',
          fin ? res.finalScore : '-',
          Number(pkg.kktp || 75),
          fin ? (res.passed ? 'Tuntas' : 'Remedial') : '-',
          fin && res.hasUngradedEssay ? 'Esai belum dikoreksi' : ''
        ]);
      });
      const safe = s => String(s).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      const fname = `hasil_asesmen_${safe(selClass === 'ALL' ? 'semua_kelas' : selClass)}_${safe(pkg.id)}.xls`;
      downloadExcelXLS(fname, selClass === 'ALL' ? 'Semua_Kelas' : selClass, rows, [6, 14, 14, 28, 12, 20, 12, 11, 14, 11, 8, 13, 22]);
      showToast('Ekspor Hasil Asesmen Berhasil', `File ${fname} siap digunakan.`, 'success');
    }

      const classes = ['ALL', ...sortClassNames([...new Set(state.students.map(s => s.className))])];

      const allTakers = pxGuruStudents();
      const passedCount = allTakers.filter(st => computeStudentScores(st).passed).length;
      const remedialCount = Math.max(0, allTakers.length - passedCount);
      const avgScore = allTakers.length > 0
        ? (allTakers.reduce((sum, st) => sum + computeStudentScores(st).finalScore, 0) / allTakers.length).toFixed(1)
        : '0.0';

      return `
        <div class="space-y-4">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5 no-print">
            <div class="studio-card p-4 space-y-1">

              <div class="text-[11px] text-slate-500">${allTakers.length > 0 ? Math.round((passedCount / allTakers.length) * 100) : 0}% dari ${allTakers.length} peserta</div>
            </div>

    function renderAdminUsers() {
      const sub = state.adminUserSubTab || 'siswa';
      const q = (state.userQ || '').toLowerCase();
      const classFilter = state.adminUserClassFilter || 'ALL';
      const sortMode = state.adminUserSort || 'name_asc';
      const allClasses = sortClassNames([...new Set(state.students.map(s => s.className))]);
      const baseFilteredStudents = state.students.filter(s =>
        (classFilter === 'ALL' || s.className === classFilter) &&
        `${s.name} ${s.nis} ${s.nisn} ${s.className} ${s.room} ${s.session}`.toLowerCase().includes(q)
      );
      const filteredStudents = [...baseFilteredStudents].sort((a, b) => {
        if (sortMode === 'name_desc') {
          return String(b.name || '').localeCompare(String(a.name || ''), 'id', { sensitivity: 'base' });
        }
        if (sortMode === 'class_name') {
          return String(a.className || '').localeCompare(String(b.className || ''), 'id', { numeric: true, sensitivity: 'base' }) ||
            String(a.name || '').localeCompare(String(b.name || ''), 'id', { sensitivity: 'base' });
        }
        if (sortMode === 'nis_asc') {
          return String(a.nis || '').localeCompare(String(b.nis || ''), 'id', { numeric: true });
        }
        return String(a.name || '').localeCompare(String(b.name || ''), 'id', { sensitivity: 'base' }) ||
          String(a.className || '').localeCompare(String(b.className || ''), 'id', { numeric: true, sensitivity: 'base' });
      });
      const teachers = state.staffAccounts.filter(a => a.role === 'guru' && `${a.name} ${a.nip} ${a.subject || ''} ${a.subtitle}`.toLowerCase().includes(q));

      return `
        <div class="space-y-4">
          <div class="studio-card p-4 sm:p-5 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="flex flex-wrap items-center gap-2 text-xs">
                <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-300 font-semibold">
                  <button type="button" onclick="state.adminUserSubTab='siswa'; renderApp();"
                    class="px-3 py-1.5 rounded-lg transition whitespace-nowrap ${sub === 'siswa' ? 'bg-[#1E3A5F] text-white shadow-xs' : 'text-slate-700'}">
                    Peserta Didik (${state.students.length})
                  </button>
                  <button type="button" onclick="state.adminUserSubTab='guru'; renderApp();"
                    class="px-3 py-1.5 rounded-lg transition whitespace-nowrap ${sub === 'guru' ? 'bg-[#1E3A5F] text-white shadow-xs' : 'text-slate-700'}">
                    Guru Mapel (${state.staffAccounts.filter(a => a.role === 'guru').length})
                  </button>
                </div>
                ${sub === 'siswa' ? `
                  <select onchange="state.adminUserClassFilter=this.value; renderApp();" class="p-2 rounded-lg border border-slate-300 bg-white font-semibold text-xs">
                    <option value="ALL" ${classFilter === 'ALL' ? 'selected' : ''}>Semua Kelas (${state.students.length} Siswa)</option>
                    ${allClasses.map(c => {
                      const cnt = state.students.filter(s => s.className === c).length;
                      return `<option value="${pxEsc(c)}" ${classFilter === c ? 'selected' : ''}>${pxEsc(c)} (${cnt} Siswa)</option>`;
                    }).join('')}
                  </select>

    // =========================================================================
    // ADMIN: DATA SOAL GURU (lihat, edit, nonaktifkan/aktifkan, hapus)
    // =========================================================================
    function adminSoalCanManage() { return !pxScope(); }

    function adminSoalFiltered() {
      const f = state.adminSoalFilter;
      const q = String(f.search || '').trim().toLowerCase();
      return state.questions.filter(item => {
        if (f.teacher !== 'ALL' && item.ownerId !== f.teacher) return false;
        if (f.pkg !== 'ALL' && item.packageId !== f.pkg) return false;
        if (f.topic !== 'ALL' && (item.topic || '') !== f.topic) return false;
        if (f.type !== 'ALL' && item.type !== f.type) return false;
        if (f.status === 'AKTIF' && !item.included) return false;
        if (f.status === 'NONAKTIF' && item.included) return false;
        if (q) {
          const hay = [item.id, item.topic, item.cp, item.atp, item.typeLabel, item.ownerName, stripHtmlTags(item.formattedPrompt)].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function adminSoalSetFilter(key, val) {
      state.adminSoalFilter[key] = val;
      if (key === 'teacher') state.adminSoalFilter.pkg = 'ALL';
      renderApp();
    }

    function adminSoalReset() {
      state.adminSoalFilter = { teacher: 'ALL', pkg: 'ALL', topic: 'ALL', type: 'ALL', status: 'ALL', search: '' };
      state.adminSoalSel = [];
      renderApp();
    }

    function adminSoalToggleSel(id) {
      const i = state.adminSoalSel.indexOf(id);
      if (i >= 0) state.adminSoalSel.splice(i, 1); else state.adminSoalSel.push(id);
      renderApp();
    }

    function adminSoalSelAll(checked) {
      state.adminSoalSel = checked ? adminSoalFiltered().map(q => q.id) : [];
      renderApp();
    }

    function adminSoalSetActive(ids, active) {
      if (!adminSoalCanManage()) return;
      const touchedPkgs = new Set();
      let n = 0;
      ids.forEach(id => {
        const q = state.questions.find(item => item.id === id);
        if (!q) return;
        q.included = active;
        q.adminDisabled = !active;
        if (q.packageId) touchedPkgs.add(q.packageId);
        n++;
      });
      touchedPkgs.forEach(pid => {
        const pkg = state.examPackages.find(pk => pk.id === pid);
        if (pkg) syncPackageAcrossSystem(pkg, { activateForStudents: false, silent: true });
      });
      pxLog(active ? 'Aktifkan Butir Soal (Admin)' : 'Nonaktifkan Butir Soal (Admin)', `${n} butir soal`, ids.slice(0, 5).join(', ') + (ids.length > 5 ? ', ...' : ''), null);
      pxSaveImmediate();
      renderApp();
      const liveTouched = touchedPkgs.has(state.examConfig.activePackageId) && state.students.some(hasExamData);
      showToast(active ? 'Soal Diaktifkan' : 'Soal Dinonaktifkan',
        `${n} butir soal ${active ? 'diaktifkan kembali dan' : 'dinonaktifkan:'} ${active ? 'masuk' : 'tidak lagi masuk'} paket ujian siswa.${liveTouched ? ' Paket sedang berjalan, skor peserta dapat berubah.' : ''}`,
        liveTouched ? 'warning' : 'success');
    }

    function adminSoalToggleOne(qId) {
      const q = state.questions.find(item => item.id === qId);
      if (q) adminSoalSetActive([qId], !q.included);
    }

    function adminSoalBulkDeleteConfirm(label) {
      if (!adminSoalCanManage()) return;
      const ids = state.adminSoalSel.filter(id => state.questions.some(q => q.id === id));
      if (ids.length === 0) return;
      const liveWarn = ids.some(id => { const q = state.questions.find(x => x.id === id); return q && q.packageId === state.examConfig.activePackageId; }) && state.students.some(hasExamData);
      openModal(`
        <div class="p-6 space-y-4">
          <h3 class="font-bold text-base text-slate-900">Hapus ${ids.length} Butir Soal ${label ? '(' + pxEsc(label) + ')' : 'Terpilih'}?</h3>
          <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">Butir soal yang dipilih akan dihapus dari bank soal guru dan paket ujian. Tindakan ini tidak dapat dibatalkan.</p>
          ${liveWarn ? `<p class="text-xs p-2.5 rounded-lg bg-amber-50 border border-amber-300 text-amber-900 leading-relaxed"><strong>Perhatian:</strong> sebagian soal berada di paket yang sedang berjalan dan sudah ada peserta yang mengerjakan. Skor peserta dapat berubah.</p>` : ''}
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">Batal</button>
            <button type="button" onclick="adminSoalBulkDeleteExec()" class="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold">Ya, Hapus ${ids.length} Soal</button>
          </div>
        </div>
      `);
    }

    function adminSoalBulkDeleteExec() {
      if (!adminSoalCanManage()) return;
      const ids = new Set(state.adminSoalSel);
      const pkgIds = new Set(state.questions.filter(q => ids.has(q.id) && q.packageId).map(q => q.packageId));
      const before = state.questions.length;
      state.questions = state.questions.filter(q => !ids.has(q.id));
      const n = before - state.questions.length;
      pkgIds.forEach(pid => {
        const pkg = state.examPackages.find(pk => pk.id === pid);
        if (pkg) syncPackageAcrossSystem(pkg, { activateForStudents: false, silent: true });
      });
      state.adminSoalSel = [];
      pxLog('Hapus Butir Soal (Admin)', `${n} butir soal`, 'Dihapus massal dari menu Data Soal Guru', null);
      closeModal();
      pxSaveImmediate();
      renderApp();
      showToast('Soal Dihapus', `${n} butir soal telah dihapus dari bank soal.`, 'info');
    }

    // ---- Tampilan Per Topik & Per Paket (Data Soal Guru) ----
    function adminSoalSetView(v) {
      state.adminSoalView = v;

    function adminPkgVisible(pk) {
      const t = state.adminSoalFilter.teacher;
      return t === 'ALL' || pk.ownerId === t || (Array.isArray(pk.sharedWith) && pk.sharedWith.includes(t));
    }

    function adminTopikGroups() {
      const f = state.adminSoalFilter;
      const s = String(f.search || '').trim().toLowerCase();
      const map = new Map();
      state.questions.forEach(q => {
        if (f.teacher !== 'ALL' && q.ownerId !== f.teacher) return;
        if (f.pkg !== 'ALL' && q.packageId !== f.pkg) return;
        const topic = q.topic || '(Tanpa Topik)';
        if (s && !(topic + ' ' + (q.ownerName || '')).toLowerCase().includes(s)) return;
        const key = (q.packageId || '-') + '||' + topic;
        if (!map.has(key)) map.set(key, { packageId: q.packageId, topic, rawTopic: q.topic || '', ownerName: q.ownerName || '-', ownerId: q.ownerId, items: [] });
        map.get(key).items.push(q);
      });
      return [...map.values()].sort((a, b) => (a.ownerName + a.topic).localeCompare(b.ownerName + b.topic, 'id', { sensitivity: 'base' }));
    }

    function adminTopikAct(act, i, arg) {
      if (!adminSoalCanManage() && act !== 'view') return;
      const g = adminTopikGroups()[i];
      if (!g) return;
      const ids = g.items.map(q => q.id);
      if (act === 'view') {
        state.adminSoalFilter.pkg = g.packageId || 'ALL';
        state.adminSoalFilter.topic = g.rawTopic || 'ALL';
        state.adminSoalView = 'soal';
        renderApp();
      } else if (act === 'on') {
        adminSoalSetActive(ids, true);
      } else if (act === 'off') {
        adminSoalSetActive(ids, false);
      } else if (act === 'del') {
        state.adminSoalSel = ids;
        adminSoalBulkDeleteConfirm('Topik: ' + g.topic);
      } else if (act === 'edit') {
        openModal(`
          <form onsubmit="adminTopikSave(event, ${i})" class="p-6 space-y-4 text-xs sm:text-sm">
            <h3 class="font-bold text-base text-slate-900">Edit Topik</h3>
            <p class="text-slate-600 leading-relaxed">Nama topik akan diubah pada <strong>${ids.length} butir soal</strong> milik ${pxEsc(g.ownerName)}.</p>
            <input type="text" id="topik-edit-name" required value="${pxEsc(g.rawTopic)}" class="w-full p-2.5 rounded-lg border border-slate-300 font-semibold">

            </div>

    function adminTopikSave(e, i) {
      e.preventDefault();
      if (!adminSoalCanManage()) return;
      const g = adminTopikGroups()[i];
      const name = document.getElementById('topik-edit-name').value.trim();
      if (!g || !name) return;
      g.items.forEach(q => { q.topic = name; q.tp = q.atp || name; });
      const pkg = state.examPackages.find(p => p.id === g.packageId);
      if (pkg) syncPackageAcrossSystem(pkg, { activateForStudents: false, silent: true });
      pxLog('Edit Topik Soal (Admin)', `${g.items.length} butir soal`, `${g.rawTopic || '-'} -> ${name}`, null);

    function adminPaketAct(act, pkgId) {
      const pkg = state.examPackages.find(p => p.id === pkgId);
      if (!pkg) return;
      if (act === 'view') {
        state.adminSoalFilter.pkg = pkg.id;
        state.adminSoalFilter.topic = 'ALL';
        state.adminSoalView = 'soal';
        renderApp();
        return;
      }
      if (!adminSoalCanManage()) return;
      const ids = state.questions.filter(q => q.packageId === pkg.id).map(q => q.id);
      if (act === 'hide' || act === 'show') {
        if (act === 'hide' && state.examConfig.activePackageId === pkg.id) {
          showToast('Tidak Dapat Dinonaktifkan', 'Paket sedang aktif di sesi siswa. Aktifkan paket lain terlebih dahulu.', 'warning');
          return;
        }
        pkg.hidden = (act === 'hide');
        pxLog(pkg.hidden ? 'Nonaktifkan Paket Ujian (Admin)' : 'Aktifkan Kembali Paket Ujian (Admin)', pkg.title, pkg.hidden ? 'Paket disembunyikan dari siswa' : 'Paket kembali tampil di siswa', null);
        pxSaveImmediate();
        renderApp();
        showToast(pkg.hidden ? 'Paket Dinonaktifkan' : 'Paket Diaktifkan Kembali', pkg.hidden ? `"${pkg.title}" tidak lagi muncul di portal siswa.` : `"${pkg.title}" kembali tersedia untuk dijadwalkan dan tampil di siswa.`, pkg.hidden ? 'info' : 'success');
        return;
      }
      if (act === 'on') adminSoalSetActive(ids, true);
      else if (act === 'off') adminSoalSetActive(ids, false);
      else if (act === 'edit') {
        openModal(`
          <form onsubmit="adminPaketSave(event, '${pxEsc(pkg.id)}')" class="p-6 space-y-3 text-xs sm:text-sm">

            <label class="block space-y-1"><span class="font-semibold text-slate-700">Topik Paket</span>
              <input type="text" id="pk-topic" value="${pxEsc(pkg.topic || '')}" class="w-full p-2.5 rounded-lg border border-slate-300"></label>
            <div class="grid grid-cols-3 gap-2">
              <label class="block space-y-1"><span class="font-semibold text-slate-700">Durasi (menit)</span>
                <input type="number" id="pk-dur" min="5" required value="${Number(pkg.durationMinutes || 60)}" class="w-full p-2.5 rounded-lg border border-slate-300 font-mono-code"></label>
              <label class="block space-y-1"><span class="font-semibold text-slate-700">KKTP</span>
                <input type="number" id="pk-kktp" min="0" max="100" required value="${Number(pkg.kktp || 75)}" class="w-full p-2.5 rounded-lg border border-slate-300 font-mono-code"></label>
              <label class="block space-y-1"><span class="font-semibold text-slate-700">Target Soal</span>
                <input type="number" id="pk-target" min="1" required value="${Number(pkg.targetQuestionCount || 10)}" class="w-full p-2.5 rounded-lg border border-slate-300 font-mono-code"></label>
            </div>
            <div class="flex justify-end gap-2 pt-1">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">Batal</button>
              <button type="submit" class="px-4 py-2 rounded-lg btn-sapphire text-xs font-semibold">Simpan Paket</button>
            </div>
          </form>`);
      } else if (act === 'del') {
        const linked = state.schedules.filter(s => s.packageId === pkg.id).length;
        const siblings = state.examPackages.filter(p => p.ownerId === pkg.ownerId).length;
        let block = '';
        if (state.examConfig.activePackageId === pkg.id) block = 'Paket ini sedang aktif di sesi siswa. Aktifkan paket lain dulu.';
        else if (linked > 0) block = `Paket ini terhubung ke ${linked} jadwal sesi. Hapus atau ganti paket pada jadwal tersebut terlebih dahulu.`;
        else if (siblings <= 1) block = 'Ini satu-satunya paket milik guru tersebut, sehingga tidak dapat dihapus.';
        openModal(`
          <div class="p-6 space-y-4">
            <h3 class="font-bold text-base text-slate-900">${block ? 'Paket Tidak Dapat Dihapus' : 'Hapus Paket Ujian?'}</h3>
            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed"><strong>${pxEsc(pkg.title)}</strong><br>${block ? pxEsc(block) : `Paket beserta ${ids.length} butir soalnya akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.`}</p>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">${block ? 'Tutup' : 'Batal'}</button>
              ${block ? '' : `<button type="button" onclick="adminPaketDeleteExec('${pxEsc(pkg.id)}')" class="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold">Ya, Hapus Paket</button>`}
            </div>
          </div>`);
      }
    }

    function adminPaketSave(e, pkgId) {
      e.preventDefault();
      if (!adminSoalCanManage()) return;
      const pkg = state.examPackages.find(p => p.id === pkgId);
      if (!pkg) return;
      pkg.title = document.getElementById('pk-title').value.trim() || pkg.title;
      pkg.topic = document.getElementById('pk-topic').value.trim();
      pkg.durationMinutes = Math.max(5, Number(document.getElementById('pk-dur').value) || pkg.durationMinutes);
      pkg.kktp = Math.min(100, Math.max(0, Number(document.getElementById('pk-kktp').value) || 0));
      pkg.targetQuestionCount = Math.max(1, Number(document.getElementById('pk-target').value) || 1);
      syncPackageAcrossSystem(pkg, { activateForStudents: false, silent: true });
      pxLog('Edit Paket Ujian (Admin)', pkg.title, `Durasi ${pkg.durationMinutes}m, KKTP ${pkg.kktp}, target ${pkg.targetQuestionCount}`, null);
      closeModal();
      pxSaveImmediate();
      renderApp();
      showToast('Paket Diperbarui', 'Perubahan paket tersinkron ke jadwal dan sesi siswa.', 'success');
    }

    function adminPaketDeleteExec(pkgId) {
      if (!adminSoalCanManage()) return;
      const pkg = state.examPackages.find(p => p.id === pkgId);
      if (!pkg || state.examConfig.activePackageId === pkgId || state.schedules.some(s => s.packageId === pkgId)) return;
      const n = state.questions.filter(q => q.packageId === pkgId).length;
      state.questions = state.questions.filter(q => q.packageId !== pkgId);
      state.examPackages = state.examPackages.filter(p => p.id !== pkgId);
      if (state.selectedTeacherPackageId === pkgId) state.selectedTeacherPackageId = null;
      if (state.hasilPackageId === pkgId) state.hasilPackageId = null;
      if (state.adminSoalFilter.pkg === pkgId) state.adminSoalFilter.pkg = 'ALL';
      state.adminSoalSel = [];
      pxLog('Hapus Paket Ujian (Admin)', pkg.title, `${n} butir soal ikut dihapus`, null);
      closeModal();
      pxSaveImmediate();
      renderApp();
      showToast('Paket Dihapus', `Paket dan ${n} butir soalnya telah dihapus.`, 'info');
    }

    // =========================================================================
    // 8. CONTROLLERS, TIMERS, ANTI-CHEAT & KEYBOARD SHORTCUTS
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('app-root');
      const authControls = document.getElementById('auth-user-controls');
      const examTelemetry = document.getElementById('header-exam-telemetry');
      const progressTrack = document.getElementById('header-progress-track');
      const progressFill = document.getElementById('header-progress-fill');
      const isExamActive = state.authSession.isAuthenticated && state.currentRole === 'siswa' && state.studentSession.step === 'exam';

      document.body.classList.toggle('exam-mode', isExamActive);
      if (progressTrack) progressTrack.classList.toggle('hidden', !isExamActive);

      if (examTelemetry) {
        if (isExamActive) {
          const ss = state.studentSession;
          const orderedQ = getOrderedQuestionsForStudent();
          const answered = orderedQ.filter(q => pxHas(ss.answers[q.id])).length;
          const pct = Math.round((answered / Math.max(1, orderedQ.length)) * 100);
          if (progressFill) progressFill.style.width = `${pct}%`;

          const isCritical = ss.remainingSeconds <= 300;
          examTelemetry.className = 'hidden md:flex items-center gap-2 shrink-0';
          examTelemetry.innerHTML = `
            <div class="flex items-center gap-0.5 rounded-lg border border-slate-300 bg-slate-50 p-0.5 text-[11px] font-semibold">
              <button type="button" onclick="state.studentSession.fontSize='sm'; renderApp();" class="px-2 py-1 rounded ${ss.fontSize === 'sm' ? 'bg-[#1E3A5F] text-white' : 'text-slate-600'}">A-</button>
              <button type="button" onclick="state.studentSession.fontSize='base'; renderApp();" class="px-2 py-1 rounded ${ss.fontSize === 'base' ? 'bg-[#1E3A5F] text-white' : 'text-slate-600'}">A</button>
              <button type="button" onclick="state.studentSession.fontSize='lg'; renderApp();" class="px-2 py-1 rounded ${ss.fontSize === 'lg' ? 'bg-[#1E3A5F] text-white' : 'text-slate-600'}">A+</button>
            </div>
            <div class="px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-300 text-xs font-mono-code font-semibold text-slate-700 whitespace-nowrap">
              ${answered}/${orderedQ.length} (${pct}%)
            </div>
            <div id="exam-timer-badge" class="px-3 py-1.5 rounded-lg ${isCritical ? 'bg-rose-700' : 'bg-[#1E3A5F]'} text-white font-mono-code font-bold text-xs flex items-center gap-1.5 whitespace-nowrap">
              <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-200"></i>
              <span>${pxFmt(ss.remainingSeconds)}</span>
            </div>
          `;
        } else {
          examTelemetry.className = 'hidden';
          examTelemetry.innerHTML = '';
        }
      }

      if (authControls) {
        if (!state.authSession.isAuthenticated) {
          authControls.innerHTML = '';
        } else {
          const u = state.authSession.user;
          const roleTag = state.currentRole === 'siswa' ? 'SISWA' : (state.currentRole === 'guru' ? 'GURU MAPEL' : 'PROKTOR / ADMIN');
          authControls.innerHTML = `
            <div class="hidden sm:flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-300 text-xs max-w-[230px]">
              <span class="px-1.5 py-0.5 rounded bg-[#1E3A5F] text-white font-mono-code font-bold text-[10px] shrink-0">${roleTag}</span>
              <span class="font-semibold text-slate-800 truncate">${pxEsc(u.name)}</span>
            </div>
            <button type="button" onclick="logoutSession()" class="hide-exam inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-rose-50 hover:text-rose-700 hover:border-rose-300 text-slate-700 text-xs font-semibold transition whitespace-nowrap" title="Keluar dari Sesi">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
              <span class="hidden sm:inline">Keluar</span>
            </button>
          `;
        }
      }

      if (!state.authSession.isAuthenticated) root.innerHTML = renderLoginScreen();
      else if (state.currentRole === 'siswa') root.innerHTML = renderSiswaView();
      else if (state.currentRole === 'guru') root.innerHTML = renderGuruView();
      else root.innerHTML = renderAdminView();

      if (window.lucide) lucide.createIcons();
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([root]).catch(() => {});
      }
      pxSave();
    }

    function selectLoginTab(tab) {
      state.authSession.loginTab = tab;
      renderApp();
    }

    function handleAuthLogin(e) {
      e.preventDefault();
      const tab = state.authSession.loginTab;
      const username = (document.getElementById('login-username')?.value || '').trim();
      const password = (document.getElementById('login-password')?.value || '').trim();

      if (tab === 'siswa') {
        const student = state.students.find(s => String(s.nis).trim() === username);
        if (!student || String(student.password).trim() !== password) {
          showToast('Autentikasi Gagal', 'NIS atau password peserta didik tidak sesuai.', 'danger');
          return;
        }
        state.authSession.isAuthenticated = true;
        state.currentRole = 'siswa';
        state.authSession.user = { id: student.id, name: student.name, username: student.nis };
        state.studentSession.studentId = student.id;
        state.studentSession.answers = { ...(student.answers || {}) };
        state.studentSession.flagged = { ...(student.savedFlagged || {}) };
        state.studentSession.currentQuestionIndex = student.lastQuestionIndex || 0;
        state.studentSession.violations = student.violations || 0;
        state.studentSession.remainingSeconds = (student.savedRemainingSeconds !== null && student.savedRemainingSeconds !== undefined)
          ? student.savedRemainingSeconds
          : (state.examConfig.durationMinutes * 60);
        state.studentSession.step = 'portal';
        state.studentSession.portalTab = 'jadwal';
        renderApp();
        showToast('Login Berhasil', `Selamat datang, ${student.name}.`, 'success');
        return;
      }

      const cleanUser = username.replace(/\s+/g, '');
      const staff = state.staffAccounts.find(acc => acc.role === tab && (
        acc.username === username ||
        acc.altUsername === username ||
        (acc.nip && acc.nip.replace(/\s+/g, '') === cleanUser)
      ));
      if (!staff || staff.password !== password) {
        showToast('Autentikasi Gagal', 'NIP/Username atau kata sandi tidak valid.', 'danger');
        return;
      }

      state.authSession.isAuthenticated = true;
      state.currentRole = tab;
      state.authSession.user = { id: staff.id, name: staff.name, username: staff.username };
      if (tab === 'guru') {
        const pkgs = getTeacherPackages(staff);
        if (pkgs.length > 0) state.selectedTeacherPackageId = pkgs[0].id;
      }
      renderApp();
      showToast('Login Berhasil', `Selamat datang, ${staff.name}.`, 'success');
    }

    function logoutSession() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      state.authSession.isAuthenticated = false;
      state.authSession.user = null;
      state.studentSession.step = 'portal';
      renderApp();
    }

    function startStudentExam() {
      const tokenVal = (document.getElementById('exam-token-input')?.value || '').trim().toUpperCase();
      if (tokenVal !== curToken()) {
        showToast('Token Tidak Sesuai', `Masukkan token aktif sesi: ${curToken()}`, 'danger');
        return;
      }
      if (!state.studentSession.agreedRules) {
        showToast('Persetujuan Diperlukan', 'Centang pernyataan tata tertib ujian terlebih dahulu.', 'warning');
        return;
      }

      const st = getActiveStudent();
      if (st.status === 'Terblokir') {
        showToast('Sesi Terblokir', 'Hubungi Proktor ruang untuk membuka blokir akun Anda.', 'danger');
        return;
      }

      const ss = state.studentSession;
      st.status = 'Sedang Mengerjakan';
      st.loginTime = st.loginTime && st.loginTime !== '-' ? st.loginTime : new Date().toLocaleTimeString('id-ID');
      ss.step = 'exam';
      ss.answers = { ...(st.answers || {}) };
      ss.flagged = { ...(st.savedFlagged || {}) };
      const totalQ = getActiveExamQuestions().length;
      ss.currentQuestionIndex = Math.min(Math.max(0, st.lastQuestionIndex || 0), Math.max(0, totalQ - 1));
      ss.remainingSeconds = (st.savedRemainingSeconds !== null && st.savedRemainingSeconds !== undefined)
        ? st.savedRemainingSeconds
        : (state.examConfig.durationMinutes * 60);
      ss.serverDeadlineMs = Date.now() + ss.remainingSeconds * 1000;
      ss.lastSavedAt = 'Tersimpan otomatis';

      startExamTimer();
      renderApp();
    }

    function startExamTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const ss = state.studentSession;
        const st = getActiveStudent();
        if (ss.step !== 'exam' || ss.paused) return;
        ss.remainingSeconds = Math.max(0, ss.remainingSeconds - 1);
        st.savedRemainingSeconds = ss.remainingSeconds;
        const badge = document.getElementById('exam-timer-badge');
        if (badge) badge.querySelector('span').textContent = pxFmt(ss.remainingSeconds);
        const mobileBadge = document.getElementById('exam-timer-badge-mobile');
        if (mobileBadge) mobileBadge.querySelector('span').textContent = pxFmt(ss.remainingSeconds);
        if (ss.remainingSeconds === 0) finishStudentExam(true);
      }, 1000);
    }

    // Background Token Auto-Rotation Ticker (runs every 1s)
    setInterval(() => {
      let rotated = false;
      const now = Date.now();
      Object.keys(state.sessionTokens).forEach(room => {
        const tk = state.sessionTokens[room];
        if (tk && !tk.locked && now >= tk.next) {
          tk.token = pxGen();
          tk.next = now + pxMs();
          rotated = true;
        }
      });
      if (rotated) {
        pxSave();
        if (state.authSession.isAuthenticated && state.currentRole === 'admin' && state.adminTab === 'token') {
          renderApp();
        }
      }
    }, 1000);

    function markAnswerSaved() {
      const ss = state.studentSession;
      const st = getActiveStudent();
      st.answers = { ...ss.answers };
      st.savedFlagged = { ...ss.flagged };
      st.lastQuestionIndex = ss.currentQuestionIndex;
      st.savedRemainingSeconds = ss.remainingSeconds;
      ss.lastSavedAt = `Tersimpan ${new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    }

    function selectSingleOption(qId, key) {
      state.studentSession.answers[qId] = key;
      markAnswerSaved();
      renderApp();
    }

    function toggleMultiOption(qId, key) {
      const prev = Array.isArray(state.studentSession.answers[qId]) ? [...state.studentSession.answers[qId]] : [];
      const i = prev.indexOf(key);
      if (i >= 0) prev.splice(i, 1); else prev.push(key);
      state.studentSession.answers[qId] = prev;
      markAnswerSaved();
      renderApp();
    }

    function setStatementAnswer(qId, stId, val) {
      const prev = { ...(state.studentSession.answers[qId] || {}) };
      prev[stId] = val;
      state.studentSession.answers[qId] = prev;
      markAnswerSaved();
      renderApp();
    }

    function setMatchingAnswer(qId, pairId, val) {
      const prev = { ...(state.studentSession.answers[qId] || {}) };
      if (val) prev[pairId] = val; else delete prev[pairId];
      state.studentSession.answers[qId] = prev;
      markAnswerSaved();
      renderApp();
    }

    function saveTextAnswer(qId, val) {
      state.studentSession.answers[qId] = val;
      markAnswerSaved();
    }

    function clearQuestionAnswer(qId) {
      delete state.studentSession.answers[qId];
      markAnswerSaved();
      renderApp();
      showToast('Jawaban Dikosongkan', 'Pilihan pada butir soal ini telah dihapus.', 'info');
    }

    function toggleFlagQuestion(qId) {
      state.studentSession.flagged[qId] = !state.studentSession.flagged[qId];
      markAnswerSaved();
      renderApp();
    }

    function goToQuestion(idx) {
      const total = getOrderedQuestionsForStudent().length;
      if (idx >= 0 && idx < total) {
        state.studentSession.currentQuestionIndex = idx;
        getActiveStudent().lastQuestionIndex = idx;
        renderApp();
      }
    }

    function toggleMobileQuestionDrawer(open) {
      const drawer = document.getElementById('mobile-nav-drawer');
      if (!drawer) return;
      drawer.classList.toggle('hidden', !open);
      if (open && window.lucide) lucide.createIcons();
    }

    function playExamAudio(qId) {
      const ss = state.studentSession;
      const q = state.questions.find(item => item.id === qId);
      if (!q) return;
      const played = ss.audioPlayCountByQ[qId] || 0;
      if (played >= (q.audioMaxPlays || 2)) return;

      ss.audioPlayCountByQ[qId] = played + 1;
      ss.audioPlayingQId = qId;
      ss.audioProgressPct = 0;
      renderApp();

      if (audioProgressInterval) clearInterval(audioProgressInterval);
      audioProgressInterval = setInterval(() => {
        ss.audioProgressPct += 10;
        if (ss.audioProgressPct >= 100) {
          clearInterval(audioProgressInterval);
          ss.audioPlayingQId = null;
          ss.audioProgressPct = 0;
        }
        renderApp();
      }, 600);
    }

    function confirmFinishExam() {
      const orderedQ = getOrderedQuestionsForStudent();
      const answered = orderedQ.filter(q => pxHas(state.studentSession.answers[q.id])).length;
      const flagged = Object.values(state.studentSession.flagged).filter(Boolean).length;
      const unanswered = Math.max(0, orderedQ.length - answered);

      openModal(`
        <div class="p-6 space-y-4">
          <h3 class="font-bold text-base text-slate-900">Konfirmasi Pengumpulan Ujian</h3>
          <div class="grid grid-cols-3 gap-2.5 p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-center font-mono-code text-xs">
            <div><span class="text-slate-500 block font-sans text-[11px]">Dijawab</span><strong class="text-emerald-700 text-sm">${answered}</strong></div>
            <div><span class="text-slate-500 block font-sans text-[11px]">Ragu-Ragu</span><strong class="text-amber-700 text-sm">${flagged}</strong></div>
            <div><span class="text-slate-500 block font-sans text-[11px]">Kosong</span><strong class="text-rose-700 text-sm">${unanswered}</strong></div>
          </div>
          <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">
            Pastikan seluruh jawaban telah diperiksa. Setelah dikumpulkan, Anda tidak dapat mengubah lembar jawaban kembali.
          </p>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">Periksa Kembali</button>
            <button type="button" onclick="closeModal(); finishStudentExam(false);" class="px-4 py-2 rounded-lg btn-sapphire text-xs font-semibold">Ya, Kumpulkan Sekarang</button>
          </div>
        </div>
      `);
    }

    function finishStudentExam(autoSubmitted = false) {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      const st = getActiveStudent();
      const ss = state.studentSession;
      st.answers = { ...ss.answers };
      st.status = 'Selesai';
      st.finishTime = new Date().toLocaleTimeString('id-ID');
      st.finishedAt = Date.now();
      const usedMin = Math.max(1, Math.round((state.examConfig.durationMinutes * 60 - ss.remainingSeconds) / 60));
      st.duration = `${usedMin} menit`;
      st.lastQuestionIndex = 0;
      st.savedRemainingSeconds = null;
      st.savedFlagged = {};
      ss.step = 'finished';
      pxLog(autoSubmitted ? 'Ujian Selesai Otomatis (Waktu Habis)' : 'Ujian Dikumpulkan Peserta', `${st.name} (${st.nis})`, `Durasi ${st.duration}`, st.name);
      syncAllSystemEntities(false);
      renderApp();
      showToast(autoSubmitted ? 'Waktu Habis' : 'Ujian Selesai', 'Jawaban Anda telah tersimpan & tersinkronisasi dengan panel Guru & Admin.', 'success');
    }

    // Anti-Cheat Tab Switch Detection
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && state.authSession.isAuthenticated && state.currentRole === 'siswa' && state.studentSession.step === 'exam' && !state.studentSession.paused) {
        const st = getActiveStudent();
        state.studentSession.violations += 1;
        st.violations = state.studentSession.violations;
        if (st.violations >= pxMax()) {
          st.status = 'Terblokir';
          st.lastQuestionIndex = state.studentSession.currentQuestionIndex;
          st.savedRemainingSeconds = state.studentSession.remainingSeconds;
          st.savedFlagged = { ...state.studentSession.flagged };
          state.studentSession.step = 'portal';
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
          pxLog('Sesi Terblokir Otomatis', `${st.name} (${st.nis})`, `Pelanggaran layar ${st.violations}/${pxMax()}`, 'Sistem Anti-Cheat');
          renderApp();
          showToast('Sesi Terblokir', 'Anda melampaui batas perpindahan layar. Hubungi Proktor untuk membuka blokir.', 'danger');
        } else {
          pxLog('Peringatan Pelanggaran Layar', `${st.name} (${st.nis})`, `Pelanggaran ke-${st.violations}/${pxMax()}`, 'Sistem Anti-Cheat');
          renderApp();
          showToast(`Peringatan Pelanggaran (${st.violations}/${pxMax()})`, 'Dilarang meninggalkan jendela ujian!', 'warning');
        }
      }
    });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeModal(); toggleMobileQuestionDrawer(false); return; }
      if (!state.authSession.isAuthenticated || state.currentRole !== 'siswa' || state.studentSession.step !== 'exam') return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

      const idx = state.studentSession.currentQuestionIndex;
      const orderedQ = getOrderedQuestionsForStudent();
      const q = orderedQ[idx];
      if (!q) return;

      if (e.key === 'ArrowRight') { e.preventDefault(); goToQuestion(idx + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); goToQuestion(idx - 1); }
      else if (q.type === 'PG') {
        const map = { a: 0, '1': 0, b: 1, '2': 1, c: 2, '3': 2, d: 3, '4': 3, e: 4, '5': 4 };
        const pos = map[e.key.toLowerCase()];
        const opts = getOrderedOptionsForQuestion(q);
        if (pos !== undefined && opts[pos]) {
          e.preventDefault();
          selectSingleOption(q.id, opts[pos].key);
        }
      }
    });

    function updateTeacherPackageExamCategory(category) {
      const activePkg = getActiveTeacherPackage();
      if (!activePkg) return;
      activePkg.examCategory = category;
      autoGeneratePackageTitle(true);
      syncPackageAcrossSystem(activePkg, { activateForStudents: false, silent: true });

      renderApp();
    }

    function autoGeneratePackageTitle(silent = false) {
      const activePkg = getActiveTeacherPackage();
      if (!activePkg) return;
      const cat = activePkg.examCategory || 'Asesmen Sumatif';
      const subj = activePkg.subject || 'Informatika';
      activePkg.title = `${cat} — ${subj}`;
      syncPackageAcrossSystem(activePkg, { activateForStudents: false, silent: true });
      pxSaveImmediate();
      renderApp();

    function duplicateTeacherPackage(pkgId) {
      const teacherAcc = getCurrentTeacherAccount();
      const src = state.examPackages.find(p => p.id === pkgId);
      if (!src) return;
      const newPkgId = 'PKG-' + (teacherAcc ? teacherAcc.id : 'GUR') + '-' + Date.now().toString().slice(-4);
      const clonedPkg = {
        ...JSON.parse(JSON.stringify(src)),
        id: newPkgId,
        title: `${src.title} (Salinan)`,
        publishState: 'DRAFT'
      };
      state.examPackages.push(clonedPkg);

      const srcQuestions = getQuestionsForPackage(src);
      srcQuestions.forEach((q, idx) => {
        const clonedQ = JSON.parse(JSON.stringify(q));
        clonedQ.id = 'Q' + (state.questions.length + 1) + '_' + Date.now().toString().slice(-3);
        clonedQ.number = state.questions.length + 1;
        clonedQ.packageId = newPkgId;
        state.questions.push(clonedQ);
      });

      state.selectedTeacherPackageId = newPkgId;
      pxLog('Duplikasi Paket Ujian', clonedPkg.title, `${srcQuestions.length} butir soal ikut disalin`, null);
      pxSaveImmediate();
      renderApp();
      showToast('Paket Diduplikasi', `Paket baru "${clonedPkg.title}" beserta ${srcQuestions.length} butir soal siap diedit.`, 'success');
    }

      const teacherAcc = getCurrentTeacherAccount();
      const newId = 'PKG-' + (teacherAcc ? teacherAcc.id : 'GUR') + '-' + Date.now().toString().slice(-4);
      const subj = teacherAcc && teacherAcc.subject ? teacherAcc.subject : 'Informatika';
      const newPkg = {
        id: newId,
        ownerId: teacherAcc ? teacherAcc.id : 'GUR-01',

        subject: subj,

    function deleteTeacherPackage(pkgId) {
      if (state.examConfig.activePackageId === pkgId) {
        showToast('Tidak Dapat Dihapus', 'Paket sedang aktif digunakan dalam sesi ujian.', 'warning');
        return;
      }
      const pkg = state.examPackages.find(p => p.id === pkgId);
      if (!pkg) return;
      openModal(`
        <div class="p-6 space-y-4">
          <h3 class="font-bold text-base text-slate-900">Hapus Paket Ujian?</h3>
          <p class="text-xs sm:text-sm text-slate-600">Paket <strong>"${pxEsc(pkg.title)}"</strong> beserta butir soal di dalamnya akan dihapus permanen.</p>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">Batal</button>
            <button type="button" onclick="executeDeleteTeacherPackage('${pkgId}')" class="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold">Ya, Hapus Paket</button>
          </div>
        </div>
      `);
    }

    function executeDeleteTeacherPackage(pkgId) {
      state.examPackages = state.examPackages.filter(p => p.id !== pkgId);
      state.questions = state.questions.filter(q => q.packageId !== pkgId);
      const teacherAcc = getCurrentTeacherAccount();
      const remaining = getTeacherPackages(teacherAcc);
      state.selectedTeacherPackageId = remaining[0] ? remaining[0].id : null;
      closeModal();
      pxSaveImmediate();
      renderApp();
      showToast('Paket Dihapus', 'Paket soal berhasil dihapus.', 'info');
    }

    function publishTeacherPackageToExam() {
      const activePkg = getActiveTeacherPackage();
      if (!activePkg) return;
      const readiness = getPackageReadiness(activePkg);
      if (readiness.activeCount === 0) {
        showToast('Paket Kosong', 'Tambahkan minimal 1 butir soal aktif pada paket ini sebelum mengaktifkan ujian.', 'warning');
        return;
      }
      syncPackageAcrossSystem(activePkg, { activateForStudents: true });
      pxSaveImmediate();
      renderApp();
      showToast('Paket Diaktifkan & Tersinkron', `"${activePkg.title}" (${readiness.activeCount} soal) aktif di portal siswa & jadwal Admin.`, 'success');
    }

    function activatePackageForExam(pkgId) {
      const pkg = state.examPackages.find(p => p.id === pkgId);
      if (!pkg) return;
      if (pkg.hidden) {
        showToast('Paket Nonaktif', 'Aktifkan kembali paket ini terlebih dahulu sebelum dijadikan sesi ujian.', 'warning');
        return;
      }
      const readiness = getPackageReadiness(pkg);
      if (readiness.activeCount === 0) {
        showToast('Paket Belum Berisi Soal', 'Guru belum menambahkan butir soal aktif pada paket ini.', 'warning');
        return;
      }
      syncPackageAcrossSystem(pkg, { activateForStudents: true });
      pxSaveImmediate();
      renderApp();
      showToast('Paket Ujian Diaktifkan', `Sesi ujian aktif beralih ke "${pkg.title}" (${readiness.activeCount} soal).`, 'success');
    }

    function assignSchedulePackage(schId, pkgId) {
      const sch = state.schedules.find(s => s.id === schId);
      const pkg = state.examPackages.find(p => p.id === pkgId);
      if (!sch || !pkg) return;
      sch.packageId = pkg.id;
      sch.ownerId = pkg.ownerId;
      sch.subject = pkg.subject;
      sch.topic = pkg.topic;
      sch.duration = Number(pkg.durationMinutes || sch.duration || 90);
      sch.grade = pkg.grade || sch.grade;
      if (sch.status === 'Berlangsung') {
        syncPackageAcrossSystem(pkg, { activateForStudents: true });
      } else {
        pxLog('Tautkan Paket ke Jadwal', sch.id, pkg.title, null);
      }
      pxSaveImmediate();
      renderApp();
      showToast('Jadwal Tersinkron', `Sesi ${sch.session} ditautkan ke "${pkg.title}".`, 'success');
    }

        pxSaveImmediate();

        renderApp();

                <span class="px-2.5 py-0.5 rounded bg-blue-50 text-[#1E3A5F] border border-blue-200 font-semibold">&rarr; ${pxEsc(pr.right)}</span>
              </div>
            `).join('')}
          </div>
        `;
      } else if (q.type === 'ISIAN') {
        keyPreviewHtml = `
          <div class="p-3 rounded-lg bg-emerald-50 border border-emerald-300 text-xs">
            <span class="font-bold text-emerald-900">Kunci Jawaban Isian Singkat:</span>
            <span class="font-mono-code font-bold text-emerald-800 ml-1">${pxEsc(q.correctText || '-')}</span>
          </div>
        `;
      } else if (q.type === 'ESAI') {
        keyPreviewHtml = `
          <div class="p-3 rounded-lg bg-amber-50 border border-amber-300 text-xs space-y-1">
            <div class="font-bold text-amber-900">Pedoman Kunci &amp; Rubrik Uraian:</div>
            <p class="text-slate-700 leading-relaxed">${pxEsc(q.idealAnswer || '-')}</p>
            ${q.rubric ? `<p class="text-[11px] text-slate-600 border-t border-amber-200 pt-1">${pxEsc(q.rubric)}</p>` : ''}
          </div>
        `;
      }

      openModal(`
        <div class="p-6 space-y-4 max-h-[86vh] overflow-y-auto">
          <div class="flex items-start justify-between gap-3 border-b border-slate-200 pb-3">
            <div class="space-y-1">
              <div class="flex flex-wrap items-center gap-1.5 text-xs">
                <span class="px-2 py-0.5 rounded bg-[#1E3A5F] text-white font-mono-code font-bold">${pxEsc(q.id)}</span>
                <span class="px-2 py-0.5 rounded font-semibold ${getQuestionTypeBadgeClass()}">${pxEsc(q.typeLabel)}</span>
                <span class="px-2 py-0.5 rounded font-mono-code bg-slate-100 border border-slate-300">Bobot ${q.weight} Poin</span>
              </div>
              <h3 class="font-bold text-base text-slate-900">Pratinjau Butir Soal &amp; Kunci Jawaban</h3>
            </div>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg border border-slate-300 text-slate-500 hover:text-slate-800">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="p-3 rounded-lg bg-slate-50 border border-slate-200 text-xs space-y-1">
            <div><strong class="text-[#1E3A5F]">Elemen:</strong> ${pxEsc(q.element)} &bull; <strong class="text-[#1E3A5F]">Topik:</strong> ${pxEsc(q.topic || '-')}</div>
            <div><strong class="text-[#1E3A5F]">CP:</strong> ${pxEsc(q.cp || '-')}</div>
            <div><strong class="text-[#1E3A5F]">ATP:</strong> ${pxEsc(q.atp || q.tp || '-')}</div>
          </div>

          ${q.stimulusHtml ? `<div>${q.stimulusHtml}</div>` : ''}

          <div class="p-4 rounded-xl border border-slate-300 bg-white space-y-3">
            <div class="text-[11px] font-mono-code font-bold uppercase tracking-wider text-slate-500">Tampilan Pertanyaan ke Siswa</div>
            <div class="exam-prompt-body text-sm text-slate-900">${q.formattedPrompt}</div>
          </div>

          ${keyPreviewHtml}

          <div class="flex justify-end gap-2 pt-2 border-t border-slate-200">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">Tutup</button>
            ${state.currentRole === 'guru' ? `
              <button type="button" onclick="openEditQuestionModal('${q.id}')" class="px-4 py-2 rounded-lg btn-sapphire text-xs font-semibold inline-flex items-center gap-1.5">
                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                <span>Edit Butir Soal Ini</span>
              </button>
            ` : ''}
          </div>
        </div>
      `, 'max-w-3xl');
    }

    function openQuestionEditorModal(qId = null) {
      const isEdit = Boolean(qId);
      const q = isEdit ? state.questions.find(item => item.id === qId) : null;
      const teacherAcc = getCurrentTeacherAccount();
      const activePkg = getActiveTeacherPackage(teacherAcc);

      const qType = q ? q.type : 'PG';
      const qElement = q ? q.element : 'AP — Algoritma dan Pemrograman';
      const qTopic = q ? (q.topic || '') : '';
      const qCp = q ? (q.cp || activePkg.cp || '') : (activePkg ? activePkg.cp : '');
      const qAtp = q ? (q.atp || q.tp || activePkg.atp || '') : (activePkg ? activePkg.atp : '');
      const qWeight = q ? q.weight : 10;
      const qIncluded = q ? q.included : true;
      const qPromptPlain = q ? stripHtmlTags(q.formattedPrompt).trim() : '';

      const existingStimulus = q ? (q.stimulusHtml || '') : '';
      const codeMatch = existingStimulus.match(/<code>([\s\S]*?)<\/code>/);
      const qCodeStimulus = codeMatch ? codeMatch[1].replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&') : '';

      const optMap = {};
      if (q && Array.isArray(q.options)) {
        q.options.forEach(o => { optMap[o.key] = stripHtmlTags(o.text); });
      }
      const keyPg = q && q.correctKey ? q.correctKey : 'A';
      const keysPgK = q && Array.isArray(q.correctKeys) ? q.correctKeys : ['A', 'B'];

      const bsRows = (q && Array.isArray(q.statements) && q.statements.length > 0)
        ? q.statements.map(s => ({ text: stripHtmlTags(s.text), answer: s.answer || 'Benar' }))
        : [{ text: '', answer: 'Benar' }, { text: '', answer: 'Salah' }, { text: '', answer: 'Benar' }];

      const pairRows = (q && Array.isArray(q.pairs) && q.pairs.length > 0)
        ? q.pairs.map(p => ({ left: stripHtmlTags(p.left), right: p.right || '' }))
        : [{ left: '', right: '' }, { left: '', right: '' }, { left: '', right: '' }];
      const extraDistractor = q && Array.isArray(q.distractorChoices)
        ? q.distractorChoices.filter(c => !pairRows.some(p => p.right === c)).join(', ')
        : '';

      const shortAnsVal = q && q.correctText ? q.correctText : '';
      const shortVariantsVal = q && Array.isArray(q.acceptedVariants) ? q.acceptedVariants.join(', ') : '';
      const idealAnsVal = q && q.idealAnswer ? q.idealAnswer : '';
      const rubricVal = q && q.rubric ? q.rubric : '';

      const elementsList = [
        'BK — Berpikir Komputasional',
        'TIK — Teknologi Informasi dan Komunikasi',
        'SK — Sistem Komputer',
        'JKI — Jaringan Komputer dan Internet',
        'AD — Analisis Data',
        'AP — Algoritma dan Pemrograman',
        'DSI — Dampak Sosial Informatika',
        'LD — Literasi Digital'
      ];

      openModal(`
        <form onsubmit="saveQuestionForm(event, '${isEdit ? q.id : ''}')" class="p-6 space-y-4 text-xs sm:text-sm max-h-[88vh] overflow-y-auto">

            <div>
              <h3 class="font-bold text-base text-slate-900">${isEdit ? `Edit Butir Soal (${pxEsc(q.id)})` : 'Tambah Butir Soal Baru'}</h3>

            <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg border border-slate-300 text-slate-500 hover:text-slate-800">

            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="space-y-1">
              <label class="text-xs font-semibold text-slate-700">Bentuk Soal</label>
