    /* =========================================================================
       1. SEMANTIC DESIGN TOKENS & BASE TYPOGRAPHY
       ========================================================================= */
    :root {
      --bg-canvas: #F1F5F9;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --border-hairline: #CBD5E1;
      --ink-primary: #0F172A;
      --ink-secondary: #334155;
      --ink-muted: #64748B;
      --accent-primary: #1E3A5F;
      --accent-hover: #152A45;
      --accent-soft: #EFF4F9;
    }

    html.dark {
      --bg-canvas: #0B0F17;
      --bg-surface: #131926;
      --bg-subtle: #192132;
      --border-hairline: #293548;
      --ink-primary: #F1F5F9;
      --ink-secondary: #CBD5E1;
      --ink-muted: #94A3B8;
      --accent-primary: #3B82F6;
      --accent-hover: #2563EB;
      --accent-soft: rgba(59, 130, 246, 0.14);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      font-size: 14.5px;
      line-height: 1.65;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main, section, aside, article, .studio-card {
      min-width: 0;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================================
       2. SURFACE CARDS, TOPBAR & BUTTONS
       ========================================================================= */
    .studio-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    html.dark .studio-card {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .studio-topbar {
      background-color: var(--bg-surface);
      border-bottom: 2px solid #1E3A5F;
    }

    html.dark .studio-topbar {
      background-color: #131926;
      border-bottom: 2px solid #334155;
    }

    .btn-sapphire {
      background-color: #1E3A5F;
      color: #FFFFFF;
      border: 1px solid #152A45;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .btn-sapphire:hover {
      background-color: #152A45;
    }
    html.dark .btn-sapphire {
      background-color: #2563EB;
      border-color: #1D4ED8;
    }
    html.dark .btn-sapphire:hover {
      background-color: #1D4ED8;
    }

    /* =========================================================================
       3. TABLES, HORIZONTAL TABS & STIMULUS CONTAINERS
       ========================================================================= */
    .table-scroll-wrap {
      width: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 768px) {
      .table-scroll-wrap { max-height: 72vh; }
    }

    .cbt-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: left;
    }
    .cbt-table.cbt-table { font-size: 0.8125rem; line-height: 1.4; }

    .cbt-table th,
    .cbt-table td {
      padding: 0.6rem 0.8rem;
      vertical-align: middle;
    }

    .cbt-table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #334155;
      background: #EEF2F7;
      border-bottom: 2px solid #CBD5E1;
    }
    .cbt-table tbody td {
      border-bottom: 1px solid #E2E8F0;
    }
    .cbt-table tbody tr:last-child td { border-bottom: 0; }
    .cbt-table tbody tr:nth-child(even) { background-color: #F8FAFC; }
    .cbt-table tbody tr:hover { background-color: #EAF1F9; }
    .cbt-table tbody tr.row-off td { color: #64748B; }
    .cbt-table tbody tr.row-off .font-semibold,
    .cbt-table tbody tr.row-off .font-bold { color: #64748B; }
    .cbt-table td.num, .cbt-table th.num { text-align: center; font-variant-numeric: tabular-nums; }
    .cbt-table td.col-aksi, .cbt-table th.col-aksi { text-align: right; white-space: nowrap; width: 1%; }
    .cbt-table td.col-chk, .cbt-table th.col-chk { width: 2.25rem; text-align: center; }

    @media (max-width: 767px) {
      .cbt-table td.col-aksi { position: sticky; right: 0; background: #FFFFFF; box-shadow: -6px 0 6px -6px rgba(15,23,42,0.18); }
      .cbt-table tbody tr:nth-child(even) td.col-aksi { background: #F8FAFC; }
      .cbt-table th.col-aksi { position: sticky; right: 0; z-index: 3; }
    }

    .tbl-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.9rem; height: 1.9rem; border-radius: 0.5rem;
      border: 1px solid #CBD5E1; background: #FFFFFF; color: #1E3A5F;
      cursor: pointer; transition: background-color 0.12s ease, border-color 0.12s ease;
    }
    .tbl-btn:hover { background: #F1F5F9; }
    .tbl-btn.warn { border-color: #FCD34D; background: #FFFBEB; color: #92400E; }
    .tbl-btn.warn:hover { background: #FEF3C7; }
    .tbl-btn.ok { border-color: #6EE7B7; background: #ECFDF5; color: #065F46; }
    .tbl-btn.ok:hover { background: #D1FAE5; }
    .tbl-btn.danger { border-color: #FECACA; background: #FFF1F2; color: #BE123C; }
    .tbl-btn.danger:hover { background: #FFE4E6; }
    .tbl-btn svg { width: 0.95rem; height: 0.95rem; }

    html.dark .cbt-table thead th { background: #1B2538; color: #CBD5E1; border-bottom-color: #334155; }
    html.dark .cbt-table tbody td { border-bottom-color: #263247; }
    html.dark .cbt-table tbody tr:nth-child(even) { background-color: #161E2E; }
    html.dark .cbt-table tbody tr:hover { background-color: #1E2A40; }
    html.dark .tbl-btn { background: #131926; border-color: #334155; color: #93C5FD; }

    .tab-strip {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 0.375rem;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }
    .tab-strip > button {
      flex-shrink: 0;
      white-space: nowrap;
    }

    .exam-prompt-body,
    .studio-option > div {
      overflow-wrap: break-word;
      word-break: break-word;
      min-width: 0;
    }

    .exam-prompt-body pre,
    .exam-prompt-body table,
    .studio-card pre {
      max-width: 100%;
      overflow-x: auto;
    }

    .exam-prompt-body p {
      margin-bottom: 0.85rem;
      line-height: 1.75;
    }
    .exam-prompt-body p:last-child {
      margin-bottom: 0;
    }
    .exam-prompt-body code:not(pre code) {
      padding: 0.14rem 0.42rem;
      border-radius: 5px;
      border: 1px solid #CBD5E1;
      background-color: #F1F5F9;
      color: #0F172A;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      font-weight: 600;
    }
    html.dark .exam-prompt-body code:not(pre code) {
      border-color: #334155;
      background-color: #1E293B;
      color: #E2E8F0;
    }

    .stimulus-diagram-box {
      background-color: #FFFFFF !important;
      color: #0F172A !important;
      border: 1px solid #CBD5E1 !important;
    }

    /* =========================================================================
       4. EXAM ANSWER OPTIONS & MATRIX NAVIGATION
       ========================================================================= */
    .studio-option {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      width: 100%;
      text-align: left;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1.5px solid #CBD5E1;
      background-color: #FFFFFF;
      transition: border-color 0.12s ease, background-color 0.12s ease;
    }
    html.dark .studio-option {
      background-color: #161E2E;
      border-color: #293548;
    }
    .studio-option:hover {
      border-color: #1E3A5F;
      background-color: #F8FAFC;
    }
    html.dark .studio-option:hover {
      border-color: #60A5FA;
      background-color: #1E293B;
    }
    .studio-option.selected {
      border-color: #1E3A5F;
      background-color: #EFF4F9;
    }
    html.dark .studio-option.selected {
      border-color: #3B82F6;
      background-color: rgba(59, 130, 246, 0.15);
    }
    .studio-option-key {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid #94A3B8;
      background-color: #F8FAFC;
      color: #1E3A5F;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    html.dark .studio-option-key {
      border-color: #475569;
      background-color: #1E293B;
      color: #E2E8F0;
    }
    .studio-option.selected .studio-option-key {
      background-color: #1E3A5F;
      border-color: #1E3A5F;
      color: #FFFFFF;
    }
    html.dark .studio-option.selected .studio-option-key {
      background-color: #3B82F6;
      border-color: #3B82F6;
    }

    .matrix-btn {
      aspect-ratio: 1 / 1;
      border-radius: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.8rem;
      border: 1.5px solid #CBD5E1;
      background-color: #FFFFFF;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
    }
    html.dark .matrix-btn {
      border-color: #334155;
      background-color: #192132;
      color: #E2E8F0;
    }
    .matrix-btn:hover {
      border-color: #1E3A5F;
    }
    .matrix-btn.answered {
      background-color: #1E3A5F;
      border-color: #1E3A5F;
      color: #FFFFFF;
    }
    html.dark .matrix-btn.answered {
      background-color: #2563EB;
      border-color: #2563EB;
    }
    .matrix-btn.flagged {
      background-color: #B45309 !important;
      border-color: #92400E !important;
      color: #FFFFFF !important;
    }
    .matrix-btn.active {
      outline: 2px solid #0F172A;
      outline-offset: 2px;
      font-weight: 800;
    }
    html.dark .matrix-btn.active {
      outline-color: #F8FAFC;
    }

    /* =========================================================================
       5. DARK MODE SURFACE & FORM HARMONIZATION
       ========================================================================= */
    html.dark .text-slate-900 { color: #F1F5F9 !important; }
    html.dark .text-slate-800 { color: #E2E8F0 !important; }
    html.dark .text-slate-700 { color: #CBD5E1 !important; }
    html.dark .text-slate-600 { color: #94A3B8 !important; }
    html.dark .text-slate-500 { color: #94A3B8 !important; }
    html.dark .text-\[\#1E3A5F\] { color: #60A5FA !important; }
    html.dark .bg-white { background-color: #131926 !important; }
    html.dark .bg-slate-50,
    html.dark .bg-slate-50\/60,
    html.dark .bg-slate-50\/70,
    html.dark .bg-slate-50\/90 { background-color: #192132 !important; }
    html.dark .bg-slate-100 { background-color: #1E293B !important; }
    html.dark .bg-\[\#EFF4F9\],
    html.dark .bg-blue-50,
    html.dark .bg-blue-50\/40 { background-color: rgba(59, 130, 246, 0.12) !important; }
    html.dark .border-slate-200,
    html.dark .border-slate-300,

    html.dark input:not([type="checkbox"]):not([type="radio"]),

    html.dark textarea {

      background-color: #192132 !important;
      border-color: #334155 !important;
    }

    /* =========================================================================
       6. ANIMATIONS, EXAM LOCK & PRINT MEDIA
       ========================================================================= */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.16s ease forwards;
    }

    body.exam-mode .hide-exam {
      display: none !important;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 4px; }

    @media print {
      .no-print { display: none !important; }
      body { background: #FFFFFF !important; color: #000000 !important; font-size: 11pt; }
      .studio-card { box-shadow: none !important; border: 1px solid #94A3B8 !important; background: #FFFFFF !important; }
      .table-scroll-wrap { max-height: none !important; overflow: visible !important; }
      .cbt-table thead th { position: static; }
    }
  </style>
</head>

    // Normalisasi Format Nama Kelas (contoh: x-e1 / X-E1 / X E 1 -> X.E-1)
    function normalizeClassName(raw) {
      const clean = String(raw || '').trim().toUpperCase().replace(/\s+/g, '');
      const m = clean.match(/^(X|XI|XII)[\.\-_]?([A-Z])[\.\-_]?(\d+)$/);
      if (m) return `${m[1]}.${m[2]}-${Number(m[3])}`;
      return String(raw || 'X.E-1').trim();
    }

    function sortClassNames(classList) {
      return [...classList].sort((a, b) => a.localeCompare(b, 'id', { numeric: true, sensitivity: 'base' }));
    }

    // Pengurutan data peserta berdasarkan nama (A-Z)
    function sortStudentsByName(list, direction = 'asc') {
      const factor = direction === 'desc' ? -1 : 1;
      return [...(list || [])].sort((a, b) => {
        const cmpName = String(a.name || '').localeCompare(String(b.name || ''), 'id', { sensitivity: 'base' });
        if (cmpName !== 0) return cmpName * factor;
        return String(a.className || '').localeCompare(String(b.className || ''), 'id', { numeric: true, sensitivity: 'base' });

    }

    const DEFAULT_SEED_QUESTIONS = JSON.parse(JSON.stringify(state.questions));
    (function hydrateSavedState() {
      try {
        const d = JSON.parse(localStorage.getItem('tritas_cbt_studio_v2') || 'null');
        if (d) {
          PX_KEYS.forEach(k => {
            if (k === 'students' && d.studentDatasetVersion !== STUDENT_DATASET_VERSION) {
              // Dataset peserta berganti (sumber: Excel): data peserta lama dibuang seluruhnya, tidak digabung
              return;
            }
            if (d[k] !== undefined) state[k] = d[k];
          });
          // Pastikan akun staf bawaan yang baru ditambahkan tetap tersedia
          DEFAULT_STAFF_ACCOUNTS.forEach(defAcc => {
            const exists = state.staffAccounts.some(acc => acc.id === defAcc.id || (acc.role === defAcc.role && acc.username === defAcc.username));
            if (!exists) state.staffAccounts.push(defAcc);
          });
          // Pastikan paket ujian bawaan terbaru (termasuk PKG-GUR-03) tetap tersedia
          DEFAULT_EXAM_PACKAGES.forEach(defPkg => {
            if (!state.examPackages.some(p => p.id === defPkg.id)) {
              state.examPackages.push(defPkg);
            }
          });
          // Pastikan butir soal bawaan terbaru (termasuk PU01-PU11) tetap tersedia
          DEFAULT_SEED_QUESTIONS.forEach(defQ => {
            if (!state.questions.some(q => q.id === defQ.id)) {
              state.questions.push(defQ);
            }
          });
        }
        state.students = sortStudentsByName(state.students);
      } catch (e) {}
    })();

    Object.assign(state, {
      auditLog: [],
      banners: [],
      sessionTokens: {},
      userQ: ''
    });

      if (Array.isArray(savedAudit)) state.auditLog = savedAudit;
    } catch (e) {}

    let pxSaveT = 0;
    const pxSnap = () => JSON.stringify({
      studentDatasetVersion: STUDENT_DATASET_VERSION,
      ...Object.fromEntries(PX_KEYS.map(k => [k, state[k]]))
    }, (k, v) => k === 'rt' ? undefined : v);

    function pxSave() {
      const now = Date.now();
      if (now - pxSaveT < 900) return;
      pxSaveT = now;
      try { localStorage.setItem('tritas_cbt_studio_v2', pxSnap()); } catch (e) {}
    }

    function pxSaveImmediate() {
      pxSaveT = 0;

    const pxFmt = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
    const pxTime = ts => new Date(ts).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const pxMax = () => state.examConfig.maxViolations || 3;
    const pxLive = s => s.id === state.studentSession.studentId && state.studentSession.step === 'exam';
    const pxHas = v => v !== undefined && v !== '' && !(Array.isArray(v) && !v.length) && !(v && typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length);
    const pxMs = () => Math.max(1, state.examConfig.tokenRotationMinutes || 20) * 60000;
    const pxGen = () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let token = '';
      for (let i = 0; i < 6; i++) token += chars[Math.floor(Math.random() * chars.length)];
      return token;
    };

    function pxTok(room) {
      if (!state.sessionTokens[room]) {
        state.sessionTokens[room] = { token: state.examConfig.token, locked: false, next: Date.now() + pxMs() };

    function pxScope() {

    function pxLog(action, target, reason, actor) {

    function pxRt(s) {

      };
    }

    function getCurrentTeacherAccount() {
      const u = state.authSession.user;
      if (!u || state.currentRole !== 'guru') return state.staffAccounts.find(a => a.role === 'guru') || null;
      return state.staffAccounts.find(a => a.role === 'guru' && (a.id === u.id || a.name === u.name || a.username === u.username))

    function getTeacherPackages(teacherAcc) {
      const acc = teacherAcc || getCurrentTeacherAccount();
      if (!acc) return state.examPackages;
      const list = state.examPackages.filter(p => p.ownerId === acc.id || (Array.isArray(p.sharedWith) && p.sharedWith.includes(acc.id)));

    function getActiveTeacherPackage(teacherAcc) {

    function getQuestionsForPackage(pkg) {
      if (!pkg) return [];
      const byPkg = state.questions.filter(q => q.packageId === pkg.id);
      if (byPkg.length > 0) return byPkg;
      return state.questions.filter(q => q.ownerId === pkg.ownerId && !q.packageId);
    }

    function getTeacherQuestions(teacherAcc) {
      const acc = teacherAcc || getCurrentTeacherAccount();
      if (!acc) return state.questions;
      const activePkg = getActiveTeacherPackage(acc);
      return state.questions.filter(q =>
        (q.packageId && q.packageId === activePkg.id) ||

    function getActiveExamQuestions() {
      const acc = getCurrentTeacherAccount();
      if (state.currentRole === 'guru' && acc) {
        const activePkg = getActiveTeacherPackage(acc);
        const pool = getQuestionsForPackage(activePkg).filter(q => q.included);
        if (pool.length > 0) return pool;
      }
      const activePkgId = state.examConfig.activePackageId || 'PKG-GUR-01';
      const pkgObj = state.examPackages.find(p => p.id === activePkgId);
      if (pkgObj) {
        const pool = getQuestionsForPackage(pkgObj).filter(q => q.included);
        if (pool.length > 0) return pool;
      }
      const fallback = state.questions.filter(q => q.included && q.ownerId === (state.examConfig.ownerId || 'GUR-01'));
      if (fallback.length > 0) return fallback;
      const anyIncluded = state.questions.filter(q => q.included);
      return anyIncluded.length > 0 ? anyIncluded : state.questions;

    function getPackageReadiness(pkg) {
      if (!pkg) return { ready: false, activeCount: 0, targetCount: 0, totalWeight: 0, linkedSchedules: [], issues: ['Paket tidak ditemukan'] };
      const qs = getQuestionsForPackage(pkg).filter(q => q.included);
      const activeCount = qs.length;
      const targetCount = Number(pkg.targetQuestionCount || activeCount || 1);
      const totalWeight = qs.reduce((s, q) => s + Number(q.weight || 0), 0);
      const linkedSchedules = state.schedules.filter(s => s.packageId === pkg.id);
      const issues = [];
      if (activeCount === 0) issues.push('Belum ada butir soal aktif');
      if (activeCount < targetCount) issues.push(`Kurang ${targetCount - activeCount} butir soal dari target (${activeCount}/${targetCount})`);
      if (totalWeight !== 100) issues.push(`Total bobot ${totalWeight} poin (disarankan 100)`);
      return {
        ready: activeCount > 0 && activeCount >= targetCount,
        activeCount,
        targetCount,
        totalWeight,
        linkedSchedules,
        issues
      };

    function syncAllSystemEntities(notify = false) {
      state.students = sortStudentsByName(state.students);
      const activePkg = state.examPackages.find(p => p.id === state.examConfig.activePackageId) || state.examPackages[0];
      if (activePkg) {

      }
      if (state.adminUserClassFilter !== 'ALL' && !validClasses.includes(state.adminUserClassFilter)) {
        state.adminUserClassFilter = 'ALL';
      }
      if (state.adminMonitorFilter.className !== 'ALL' && !validClasses.includes(state.adminMonitorFilter.className)) {
        state.adminMonitorFilter.className = 'ALL';
      }
      state.lastSyncedAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      pxSaveImmediate();
      if (notify) {
        renderApp();
        showToast('Sinkronisasi Berhasil', `Data ${state.students.length} Siswa (X.E-1 s.d. X.E-12), Guru, dan Admin diselaraskan.`, 'success');
      }

    function syncPackageAcrossSystem(pkg, options = {}) {
      if (!pkg) return;
      const { activateForStudents = false, silent = false } = options;

      if (activateForStudents && state.examConfig.activePackageId && state.examConfig.activePackageId !== pkg.id) {
        pxArchiveLiveResults(state.examConfig.activePackageId, pkg);
      }

      let updatedSchedulesCount = 0;
      state.schedules.forEach(sch => {
        if (sch.packageId === pkg.id) {
          sch.subject = pkg.subject;
          sch.topic = pkg.topic;
          sch.duration = Number(pkg.durationMinutes || sch.duration || 90);
          sch.grade = pkg.grade || sch.grade;
          sch.ownerId = pkg.ownerId;
          if (activateForStudents) sch.status = 'Berlangsung';
          updatedSchedulesCount++;
        } else if (activateForStudents && sch.status === 'Berlangsung') {
          sch.status = 'Terjadwal';
        }
      });

      const isCurrentlyActive = state.examConfig.activePackageId === pkg.id || activateForStudents;
      if (isCurrentlyActive) {
        const ownerAcc = state.staffAccounts.find(a => a.id === pkg.ownerId);
        Object.assign(state.examConfig, {
          activePackageId: pkg.id,
          ownerId: pkg.ownerId,
          examCategory: pkg.examCategory || 'Asesmen Sumatif',
          title: pkg.title,
          subject: pkg.subject,
          topic: pkg.topic,
          cp: pkg.cp,
          atp: pkg.atp,
          targetQuestionCount: Number(pkg.targetQuestionCount || 10),
          grade: pkg.grade,
          teacher: ownerAcc ? ownerAcc.name : state.examConfig.teacher,
          teacherNip: ownerAcc ? ownerAcc.nip : state.examConfig.teacherNip,
          durationMinutes: Number(pkg.durationMinutes || 90),
          kktp: Number(pkg.kktp || 75),
          maxViolations: Number(pkg.maxViolations || 3),
          randomizeQuestions: !!pkg.randomizeQuestions,
          randomizeOptions: !!pkg.randomizeOptions,
          showScoreToStudent: !!pkg.showScoreToStudent
        });
        pkg.publishState = 'PUBLISHED_ACTIVE';
      }

      state.lastSyncedAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      if (!silent) {
        pxLog(
          activateForStudents ? 'Aktivasi Paket & Sinkronisasi Sistem' : 'Sinkronisasi Paket Guru-Admin-Siswa',
          pkg.title,
          `Jadwal tersinkron: ${updatedSchedulesCount} sesi`,
          null
        );
      }
    }

    function getOrderedQuestionsForStudent() {
      const active = getActiveExamQuestions();
      const ss = state.studentSession;
      if (!state.examConfig.randomizeQuestions) return active;
      if (!Array.isArray(ss.questionOrder) || ss.questionOrder.length !== active.length) {
        const ids = active.map(q => q.id);
        for (let i = ids.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [ids[i], ids[j]] = [ids[j], ids[i]];
        }
        ss.questionOrder = ids;
      }
      const map = new Map(active.map(q => [q.id, q]));
      const ordered = ss.questionOrder.map(id => map.get(id)).filter(Boolean);
      return ordered.length === active.length ? ordered : active;
    }

    function getOrderedOptionsForQuestion(q) {
      const opts = q.options || [];
      if (!state.examConfig.randomizeOptions || opts.length === 0) return opts;
      const ss = state.studentSession;
      if (!ss.optionOrders) ss.optionOrders = {};
      if (!Array.isArray(ss.optionOrders[q.id]) || ss.optionOrders[q.id].length !== opts.length) {
        const keys = opts.map(o => o.key);
        for (let i = keys.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [keys[i], keys[j]] = [keys[j], keys[i]];
        }
        ss.optionOrders[q.id] = keys;
      }
      const map = new Map(opts.map(o => [o.key, o]));
      return ss.optionOrders[q.id].map(k => map.get(k)).filter(Boolean);
    }

    // =========================================================================
    // HASIL ASESMEN PER PAKET: skor, arsip hasil, & riwayat peserta
    // =========================================================================
    const pxDateLabel = ts => new Date(ts).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

    // Skor murni untuk satu paket ujian (tidak bergantung pada role/paket aktif)
    function pxScoreForPackage(pkg, data) {
      const qs = getQuestionsForPackage(pkg).filter(q => q.included);
      let objE = 0, objM = 0, esE = 0, esM = 0, ungraded = false;
      qs.forEach(q => {
        if (q.type === 'ESAI') {
          esM += q.weight;
          const m = data.essayScores ? data.essayScores[q.id] : undefined;
          if (m !== undefined && m !== null && m !== '') esE += Number(m); else ungraded = true;
        } else {
          objM += q.weight;
          objE += evaluateQuestionItemScore(q, data.answers ? data.answers[q.id] : undefined);
        }
      });
      const raw = Math.round(((objE + esE) / Math.max(1, objM + esM)) * 100);
      const kktp = Number((pkg && pkg.kktp) || 75);
      let fin = raw;
      if (data.remedialScore !== null && data.remedialScore !== undefined) {
        const rem = Number(data.remedialScore);
        if (state.remedialRule === 'highest') fin = Math.max(raw, rem);
        else if (state.remedialRule === 'average') fin = Math.round((raw + rem) / 2);
        else if (state.remedialRule === 'cap_kktp') fin = Math.min(kktp, Math.max(raw, rem));
      }
      return { rawScore100: raw, finalScore: fin, kktp, passed: fin >= kktp, hasUngradedEssay: ungraded };
    }

    // Hasil seorang peserta pada satu paket: paket aktif = data langsung, paket lain = arsip
    function pxPackageResult(st, pkg) {
      if (!pkg) return null;
      if (state.examConfig.activePackageId === pkg.id) {
        if (!hasExamData(st)) return null;
        return {
          live: true, status: st.status, duration: st.duration || '-',
          finishedAt: st.finishedAt || null,
          remedialScore: (st.remedialScore === undefined ? null : st.remedialScore),
          ...pxScoreForPackage(pkg, st)
        };
      }
      const r = st.results && st.results[pkg.id];
      if (!r) return null;
      return { live: false, ...r, ...(r.answers ? pxScoreForPackage(pkg, r) : {}) };
    }

    // Saat paket aktif berganti: simpan hasil paket lama ke arsip tiap peserta, lalu kosongkan sesi untuk paket baru
    function pxArchiveLiveResults(oldPkgId, newPkg) {
      const oldPkg = state.examPackages.find(p => p.id === oldPkgId);
      if (!oldPkg) return;
      state.students.forEach(st => {
        if (hasExamData(st)) {
          if (!st.results) st.results = {};
          st.results[oldPkg.id] = {
            pkgId: oldPkg.id, title: oldPkg.title, subject: oldPkg.subject,
            examCategory: oldPkg.examCategory, teacher: oldPkg.ownerName,
            status: st.status, duration: st.duration || '-', finishTime: st.finishTime || '-',
            finishedAt: st.finishedAt || Date.now(), violations: st.violations || 0,
            remedialScore: (st.remedialScore === undefined ? null : st.remedialScore),
            showScore: !!oldPkg.showScoreToStudent,
            answers: { ...(st.answers || {}) },
            essayScores: { ...(st.essayScores || {}) },
            essayFeedbacks: { ...(st.essayFeedbacks || {}) },
            ...pxScoreForPackage(oldPkg, st)
          };
        }
        Object.assign(st, {
          status: 'Belum Login', loginTime: '-', finishTime: '-', duration: '-', finishedAt: null,
          violations: 0, remedialScore: null, lastQuestionIndex: 0, savedRemainingSeconds: null,
          savedFlagged: {}, answers: {}, essayScores: {}, essayFeedbacks: {}
        });
      });
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      Object.assign(state.studentSession, {
        step: 'portal', agreedRules: false, currentQuestionIndex: 0, lastQuestionIndex: 0,
        remainingSeconds: Number((newPkg && newPkg.durationMinutes) || 90) * 60,
        savedRemainingSeconds: null, serverDeadlineMs: null, answers: {}, flagged: {}, savedFlagged: {},
        violations: 0, antiCheatLogs: [], questionOrder: null, optionOrders: {},
        audioPlayCountByQ: {}, audioPlayingQId: null, audioProgressPct: 0, paused: false
      });
      pxLog('Arsip Hasil Asesmen', oldPkg.title, 'Hasil peserta diarsipkan saat paket ujian aktif berganti', null);
    }

    // Tampilan peserta untuk paket arsip: pembacaan/penulisan field ujian diteruskan ke catatan arsip paket itu
    const PX_ARCH_FIELDS = ['status', 'answers', 'essayScores', 'essayFeedbacks', 'remedialScore', 'duration', 'finishTime', 'violations'];
    function pxArchivedView(st, pkgId) {
      const rec = st.results && st.results[pkgId];
      if (!rec) return null;
      return new Proxy(st, {
        get(t, k) { return PX_ARCH_FIELDS.includes(k) ? rec[k] : t[k]; },
        set(t, k, v) { if (PX_ARCH_FIELDS.includes(k)) rec[k] = v; else t[k] = v; return true; }
      });
    }

    // Daftar peserta (yang punya data ujian) untuk paket yang sedang dipilih guru: paket aktif = data langsung, selain itu = arsip
    function pxGuruStudents() {
      const pkg = getActiveTeacherPackage(getCurrentTeacherAccount());
      if (!pkg || state.examConfig.activePackageId === pkg.id) return state.students.filter(hasExamData);
      return state.students.map(st => pxArchivedView(st, pkg.id)).filter(v => v && hasExamData(v));
    }

    function pxGuruStudentById(id) {
      const pkg = getActiveTeacherPackage(getCurrentTeacherAccount());
      const st = state.students.find(s => s.id === id);
      if (!st || !pkg || state.examConfig.activePackageId === pkg.id) return st;
      return pxArchivedView(st, pkg.id) || st;
    }

    function hasExamData(st) {
      return st.status === 'Selesai' || st.status === 'Terblokir' || Object.keys(st.answers || {}).length > 0;
    }

    function stripHtmlTags(html) {
      const div = document.createElement('div');
      div.innerHTML = html || '';
      return div.textContent || div.innerText || '';
    }

    function normalizeShortAnswer(val) {
      return String(val ?? '').trim().replace(/\s+/g, ' ').replace(',', '.').toLowerCase();
    }

    function evaluateQuestionItemScore(question, ans) {
      if (ans === undefined || ans === null || ans === '') return 0;
      if (question.type === 'PG') return ans === question.correctKey ? question.weight : 0;
      if (question.type === 'PG_KOMPLEKS') {
        if (!Array.isArray(ans) || ans.length === 0) return 0;
        const correctSet = new Set(question.correctKeys || []);
        let right = 0, wrong = 0;
        ans.forEach(k => { if (correctSet.has(k)) right++; else wrong++; });
        const ratio = Math.max(0, (right - wrong * 0.5) / Math.max(1, correctSet.size));
        return Number((ratio * question.weight).toFixed(2));
      }
      if (question.type === 'BENAR_SALAH') {
        if (typeof ans !== 'object') return 0;
        const stList = question.statements || [];
        if (stList.length === 0) return 0;
        let matched = 0;
        stList.forEach(st => { if (ans[st.id] === st.answer) matched++; });
        return Number(((matched / stList.length) * question.weight).toFixed(2));
      }
      if (question.type === 'MENJODOHKAN') {
        if (typeof ans !== 'object') return 0;
        const pairs = question.pairs || [];
        if (pairs.length === 0) return 0;
        let matched = 0;
        pairs.forEach(pr => { if (ans[pr.id] === pr.right) matched++; });
        return Number(((matched / pairs.length) * question.weight).toFixed(2));
      }
      if (question.type === 'ISIAN') {
        const cleanUser = normalizeShortAnswer(ans);
        const variants = (question.acceptedVariants && question.acceptedVariants.length > 0)
          ? question.acceptedVariants.map(normalizeShortAnswer)
          : [normalizeShortAnswer(question.correctText)];
        return variants.includes(cleanUser) ? question.weight : 0;
      }
      return 0;
    }

    function computeStudentScores(student) {
      const activeQuestions = getActiveExamQuestions();
      let objectiveEarned = 0, objectiveMax = 0, essayEarned = 0, essayMax = 0;
      let hasUngradedEssay = false;

      activeQuestions.forEach(q => {
        if (q.type === 'ESAI') {
          essayMax += q.weight;
          const manualScore = student.essayScores ? student.essayScores[q.id] : undefined;
          if (manualScore !== undefined && manualScore !== null && manualScore !== '') {
            essayEarned += Number(manualScore);
          } else {
            hasUngradedEssay = true;
          }
        } else {
          objectiveMax += q.weight;
          objectiveEarned += evaluateQuestionItemScore(q, student.answers ? student.answers[q.id] : undefined);
        }
      });

      const totalEarned = objectiveEarned + essayEarned;
      const totalMax = Math.max(1, objectiveMax + essayMax);
      const rawScore100 = Math.round((totalEarned / totalMax) * 100);
      const kktp = getEffectiveExamConfig().kktp;
      let finalScore = rawScore100;
      if (student.remedialScore !== null && student.remedialScore !== undefined) {
        const rem = Number(student.remedialScore);
        if (state.remedialRule === 'highest') finalScore = Math.max(rawScore100, rem);
        else if (state.remedialRule === 'average') finalScore = Math.round((rawScore100 + rem) / 2);
        else if (state.remedialRule === 'cap_kktp') finalScore = Math.min(kktp, Math.max(rawScore100, rem));
      }

      return {
        objectiveEarned: Number(objectiveEarned.toFixed(1)),
        objectiveMax,
        essayEarned: Number(essayEarned.toFixed(1)),
        essayMax,
        hasUngradedEssay,
        rawScore100,
        finalScore,
        passed: finalScore >= kktp,
        ppaDescriptor: getPPA2025CompetencyDescriptor(student, finalScore)
      };
    }

    function getPPA2025CompetencyDescriptor(student, finalScore) {
      const kktp = getEffectiveExamConfig().kktp;
      let levelLabel = 'Cakap';
      let badgeCls = 'bg-emerald-100 text-emerald-800';

      if (finalScore >= 90) {
        levelLabel = 'Mahir';
        badgeCls = 'bg-blue-100 text-blue-800';
      } else if (finalScore >= kktp) {
        levelLabel = 'Cakap';
        badgeCls = 'bg-emerald-100 text-emerald-800';
      } else if (finalScore >= 41) {
        levelLabel = 'Layak';
        badgeCls = 'bg-amber-100 text-amber-900';
      } else {
        levelLabel = 'Baru Berkembang';
        badgeCls = 'bg-rose-100 text-rose-800';
      }

      const activeQuestions = getActiveExamQuestions();
      const masteredTopics = [], weakTopics = [];

      activeQuestions.forEach(q => {
        const earned = q.type === 'ESAI'
          ? (student.essayScores && student.essayScores[q.id] !== undefined ? Number(student.essayScores[q.id]) : 0)
          : evaluateQuestionItemScore(q, student.answers ? student.answers[q.id] : undefined);
        const topicName = (q.topic || ((q.tp || '').split('—')[1] || q.tp || 'Informatika')).trim();
        if (earned / Math.max(1, q.weight) >= 0.70) {
          if (!masteredTopics.includes(topicName)) masteredTopics.push(topicName);
        } else {
          if (!weakTopics.includes(topicName)) weakTopics.push(topicName);
        }
      });

      const goodPart = masteredTopics.length > 0
        ? `Menunjukkan penguasaan yang ${levelLabel.toLowerCase()} pada topik ${masteredTopics.slice(0, 2).join(' serta ')}.`
        : 'Mulai mengenali konsep dasar Informatika.';
      const improvePart = weakTopics.length > 0
        ? `Perlu penguatan pada topik ${weakTopics.slice(0, 2).join(' dan ')}.`
        : 'Mampu merefleksikan solusi komputasional secara mandiri dan optimal.';

      return { levelLabel, badgeCls, raporNarrative: `${goodPart} ${improvePart}` };
    }

    function computePsychometricAnalysis() {
      const activeQuestions = getActiveExamQuestions();
      const participants = pxGuruStudents();
      const N = Math.max(1, participants.length);

      const participantTotals = participants.map(st => {
        const sc = computeStudentScores(st);
        const itemScores = {};
        activeQuestions.forEach(q => {
          itemScores[q.id] = q.type === 'ESAI'
            ? (st.essayScores && st.essayScores[q.id] !== undefined ? Number(st.essayScores[q.id]) : 0)
            : evaluateQuestionItemScore(q, st.answers ? st.answers[q.id] : undefined);
        });
        return { student: st, totalScore: sc.rawScore100, itemScores };
      });

      const sortedByTotal = [...participantTotals].sort((a, b) => b.totalScore - a.totalScore);
      const groupSize = Math.max(1, Math.round(N * 0.27));
      const upperGroup = sortedByTotal.slice(0, groupSize);
      const lowerGroup = sortedByTotal.slice(Math.max(0, N - groupSize));

      const meanTotal = participantTotals.reduce((acc, p) => acc + p.totalScore, 0) / N;
      const varianceTotal = participantTotals.reduce((acc, p) => acc + Math.pow(p.totalScore - meanTotal, 2), 0) / N;
      const sdTotal = Math.sqrt(varianceTotal) || 1;
      const rTable = 0.396;
      let sumItemVariances = 0;

      const itemStats = activeQuestions.map((q, idx) => {
        const scores = participantTotals.map(p => p.itemScores[q.id] || 0);
        const maxW = Math.max(1, q.weight);
        const meanItem = scores.reduce((a, b) => a + b, 0) / N;

        const P = Number((meanItem / maxW).toFixed(2));
        let pCategory = 'Sedang (Ideal)';
        if (P > 0.70) pCategory = 'Terlalu Mudah';
        else if (P < 0.30) pCategory = 'Terlalu Sukar';

        const upperMeanRatio = upperGroup.length
          ? upperGroup.reduce((acc, p) => acc + (p.itemScores[q.id] || 0) / maxW, 0) / upperGroup.length
          : 0;
        const lowerMeanRatio = lowerGroup.length
          ? lowerGroup.reduce((acc, p) => acc + (p.itemScores[q.id] || 0) / maxW, 0) / lowerGroup.length
          : 0;
        const D = Number((upperMeanRatio - lowerMeanRatio).toFixed(2));

        let dCategory = 'Sangat Baik', recommendation = 'Diterima (Masuk Bank Soal Unggulan)';
        if (D < 0.20) { dCategory = 'Jelek'; recommendation = 'Ditolak / Periksa Ambiguitas'; }
        else if (D < 0.30) { dCategory = 'Cukup'; recommendation = 'Perlu Revisi Pengecoh'; }
        else if (D < 0.40) { dCategory = 'Baik'; recommendation = 'Diterima (Layak Digunakan)'; }

        let cov = 0, varItem = 0;
        for (let i = 0; i < participantTotals.length; i++) {
          const dx = scores[i] - meanItem;
          const dy = participantTotals[i].totalScore - meanTotal;
          cov += dx * dy;
          varItem += dx * dx;
        }
        sumItemVariances += (varItem / N);
        const sdItem = Math.sqrt(varItem / N) || 1;
        const rPbis = Number(Math.max(-0.99, Math.min(0.99, (cov / N) / (sdItem * sdTotal))).toFixed(2));
        const isValid = rPbis >= rTable;

        let distractorStats = null;
        if (q.type === 'PG' && Array.isArray(q.options)) {
          distractorStats = q.options.map(opt => {
            const count = participants.filter(st => st && st.answers && st.answers[q.id] === opt.key).length;
            const pct = Math.round((count / N) * 100);
            return {
              key: opt.key,
              count,
              pct,
              isKey: opt.key === q.correctKey,
              isWeak: opt.key !== q.correctKey && pct < 5
            };
          });
        }

        return { question: q, displayNum: idx + 1, P, pCategory, D, dCategory, rPbis, isValid, recommendation, distractorStats };
      });

      const k = activeQuestions.length;
      const totalRawScores = participantTotals.map(p => activeQuestions.reduce((sum, q) => sum + (p.itemScores[q.id] || 0), 0));
      const meanRawTotal = totalRawScores.reduce((a, b) => a + b, 0) / N;
      const varRawTotal = totalRawScores.reduce((acc, v) => acc + Math.pow(v - meanRawTotal, 2), 0) / N || 1;
      let reliability = 0.84;
      if (k > 1 && varRawTotal > 0) {
        const alpha = (k / (k - 1)) * (1 - (sumItemVariances / varRawTotal));
        reliability = Number(Math.max(0.15, Math.min(0.98, alpha)).toFixed(2));
      }
      const reliabilityLabel = reliability >= 0.80 ? 'Sangat Tinggi (Andal)' : (reliability >= 0.70 ? 'Tinggi (Andal)' : 'Cukup (Moderat)');

      return {
        N, itemStats,
        avgP: Number((itemStats.reduce((a, b) => a + b.P, 0) / Math.max(1, itemStats.length)).toFixed(2)),
        avgD: Number((itemStats.reduce((a, b) => a + b.D, 0) / Math.max(1, itemStats.length)).toFixed(2)),
        validCount: itemStats.filter(i => i.isValid).length,
        reliability, reliabilityLabel
      };
    }

    function downloadExcelXLS(filename, sheetName, rowsAoa, colWidths = [], extraSheets = []) {
      if (typeof XLSX === 'undefined') {
        showToast('Pustaka Excel Belum Siap', 'Pastikan koneksi internet aktif untuk memuat pustaka SheetJS.', 'danger');
        return;
      }
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(rowsAoa);
      if (colWidths.length > 0) ws['!cols'] = colWidths.map(w => ({ wch: w }));
      XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0, 31));

      extraSheets.forEach(sh => {
        const xWs = XLSX.utils.aoa_to_sheet(sh.rows);
        if (sh.colWidths && sh.colWidths.length > 0) xWs['!cols'] = sh.colWidths.map(w => ({ wch: w }));
        XLSX.utils.book_append_sheet(wb, xWs, sh.name.slice(0, 31));
      });

      XLSX.writeFile(wb, filename, { bookType: 'xls' });
    }

    function importStudentsXLS(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      if (typeof XLSX === 'undefined') {
        showToast('Pustaka Excel Belum Siap', 'Gagal membaca berkas Excel.', 'danger');
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          let addedCount = 0;
          let updatedCount = 0;
          let sheetsRead = 0;

          const pickField = (rowObj, candidates) => {
            const keys = Object.keys(rowObj);
            for (const cand of candidates) {
              const foundKey = keys.find(k => k.trim().toUpperCase() === cand.toUpperCase());
              if (foundKey !== undefined && String(rowObj[foundKey]).trim() !== '') {
                return String(rowObj[foundKey]).trim();
              }
            }
            return '';
          };

          wb.SheetNames.forEach(sheetName => {
            const ws = wb.Sheets[sheetName];
            if (!ws) return;
            const rawMatrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            if (!Array.isArray(rawMatrix) || rawMatrix.length === 0) return;

            // Deteksi otomatis baris header (mendukung file dengan kop surat di atas tabel)
            let headerRowIdx = 0;
            for (let r = 0; r < Math.min(12, rawMatrix.length); r++) {
              const cells = rawMatrix[r].map(c => String(c || '').trim().toUpperCase());
              const hasIdCol = cells.some(c => ['NIS', 'NIPD', 'NO INDUK', 'NO_INDUK', 'NISN'].includes(c));
              const hasNameCol = cells.some(c => ['NAMA', 'NAMA_PESERTA', 'NAMA PESERTA', 'NAMA PESERTA DIDIK', 'NAMA LENGKAP'].includes(c));
              if (hasIdCol && hasNameCol) {
                headerRowIdx = r;
                break;
              }
            }

            const jsonRows = XLSX.utils.sheet_to_json(ws, { range: headerRowIdx, defval: '' });
            if (jsonRows.length === 0) return;
            sheetsRead++;

            // Jika kolom KELAS kosong di baris, gunakan nama sheet jika berbentuk kelas (misal "X_3" atau "X.E-3")
            const fallbackClassFromSheet = /^(X|XI|XII)\b|^(X|XI|XII)[._\- ]/i.test(sheetName)
              ? normalizeClassName(sheetName.replace(/^26_27\s*/i, '').replace(/_/g, '.E-').replace(/\.E-\.E-/g, '.E-'))
              : 'X.E-1';

            jsonRows.forEach(row => {
              const nis = pickField(row, ['NIS', 'NIPD', 'NO_INDUK', 'NO INDUK', 'USERNAME']);
              const name = pickField(row, ['NAMA_PESERTA', 'NAMA PESERTA DIDIK', 'NAMA PESERTA', 'NAMA LENGKAP', 'NAMA']);
              if (!nis || !name) return;
              if (/^(NIS|NIPD|NO)$/i.test(nis) || /^(NAMA|NAMA PESERTA)$/i.test(name)) return;

              const nisn = pickField(row, ['NISN']) || '-';
              const rawClass = pickField(row, ['KELAS', 'ROMBEL', 'TINGKAT']);
              const className = normalizeClassName(rawClass || fallbackClassFromSheet);
              const genderRaw = pickField(row, ['JK', 'L/P', 'LP', 'JENIS KELAMIN', 'GENDER']).toUpperCase();
              const gender = genderRaw.startsWith('P') ? 'P' : 'L';
              const room = pickField(row, ['RUANG', 'LAB', 'LOKASI']) || 'Lab Komputer 1 (RPL)';
              const session = pickField(row, ['SESI', 'GELOMBANG']) || 'Sesi 1';

              const existing = state.students.find(s => String(s.nis).trim() === nis);
              if (existing) {
                existing.name = name;
                if (nisn !== '-') existing.nisn = nisn;
                existing.className = className;
                existing.level = className.split('.')[0] || 'X';
                existing.gender = gender;
                if (rawClass || pickField(row, ['RUANG', 'LAB'])) existing.room = room;
                if (pickField(row, ['SESI'])) existing.session = session;
                updatedCount++;
              } else {
                const idx = state.students.length + 1;
                state.students.push({
                  id: `STD-${String(idx).padStart(3, '0')}`,
                  nis, nisn, name, gender, className,
                  level: className.split('.')[0] || 'X',
                  password: nis, room, session, status: 'Belum Login',
                  loginTime: '-', finishTime: '-', duration: '-',
                  ipAddress: '-', deviceInfo: '-', violations: 0,
                  workstation: `PC-${String(((idx - 1) % 36) + 1).padStart(2, '0')}`,
                  remedialScore: null, lastQuestionIndex: 0,
                  savedRemainingSeconds: null, savedFlagged: {},
                  answers: {}, essayScores: {}, essayFeedbacks: {}
                });
                addedCount++;
              }
            });
          });

          pxLog('Impor Peserta Excel (.xls)', file.name, `${addedCount} baru, ${updatedCount} diperbarui (${sheetsRead} sheet)`, null);
          syncAllSystemEntities(false);
          renderApp();
          showToast('Impor Peserta (.xls) Berhasil', `${addedCount} siswa baru masuk, ${updatedCount} data siswa diperbarui dari ${sheetsRead} sheet.`, 'success');
        } catch (err) {
          showToast('Gagal Impor Peserta Excel', 'Periksa format kolom (KELAS, NISN, NIPD/NIS, NAMA, JK).', 'danger');
        }
        e.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    }

            if (up.includes('JODOH')) return 'MENJODOHKAN';
            if (up.includes('ISIAN') || up.includes('SINGKAT')) return 'ISIAN';
            if (up.includes('ESAI') || up.includes('URAIAN')) return 'ESAI';
            return 'PG';
          };

          jsonRows.forEach((row, idx) => {
            const promptText = String(row.Pertanyaan || row.pertanyaan || '').trim();
            if (!promptText) return;
            const type = normalizeImportedType(row.Bentuk_Soal || row.Bentuk || 'PG');
            const weight = Math.max(1, Number(row.Bobot || 10) || 10);
            const element = String(row.Elemen_CP || 'BK — Berpikir Komputasional').trim();
            const topic = String(row.Topik || 'Materi Impor Excel').trim();
            const cpVal = String(row.CP || activePkg.cp || '').trim();
            const atpVal = String(row.ATP || activePkg.atp || '').trim();
            const keyRaw = String(row.Kunci_Jawaban || '').trim();

            const rawOpts = ['A', 'B', 'C', 'D', 'E']
              .map(k => ({ key: k, raw: String(row[`Opsi_${k}`] || '').trim() }))
              .filter(o => o.raw !== '');

            const newId = 'XLS_' + Date.now().toString().slice(-4) + '_' + (idx + 1);
            const newQ = {
              id: newId,
              number: state.questions.length + 1,
              packageId: activePkg ? activePkg.id : 'PKG-GUR-01',
              ownerId: teacherAcc ? teacherAcc.id : 'GUR-01',
              ownerName: teacherAcc ? teacherAcc.name : state.examConfig.teacher,
              subject: activePkg ? activePkg.subject : state.examConfig.subject,
              grade: activePkg ? activePkg.grade : state.examConfig.grade,
              element, topic, cp: cpVal, atp: atpVal, tp: atpVal,
              cognitive: 'L2', type, typeLabel: typeLabelMap[type],
              weight, included: true,
              formattedPrompt: `<p>${pxEsc(promptText)}</p>`
            };

            if (type === 'PG' || type === 'PG_KOMPLEKS') {
              const opts = rawOpts.map(o => ({ key: o.key, text: pxEsc(o.raw) }));
              newQ.options = opts.length >= 2 ? opts : [
                { key: 'A', text: 'Opsi A' }, { key: 'B', text: 'Opsi B' }, { key: 'C', text: 'Opsi C' }, { key: 'D', text: 'Opsi D' }
              ];
              if (type === 'PG') {
                newQ.correctKey = (keyRaw.toUpperCase().split(',')[0] || 'A').trim();
              } else {
                const parsedKeys = keyRaw.toUpperCase().split(/[,;]/).map(s => s.trim()).filter(Boolean);
                newQ.correctKeys = parsedKeys.length > 0 ? parsedKeys : ['A', 'B'];
              }
            } else if (type === 'BENAR_SALAH') {
              const keyList = keyRaw.split(/[;,]/).map(s => {
                const v = s.trim().toLowerCase();
                return (v === 'salah' || v === 's' || v === 'false') ? 'Salah' : 'Benar';
              });
              const stmtItems = rawOpts.length > 0 ? rawOpts : [{ raw: 'Pernyataan 1' }, { raw: 'Pernyataan 2' }];
              newQ.statements = stmtItems.map((o, sIdx) => ({
                id: 'S' + (sIdx + 1), text: pxEsc(o.raw), answer: keyList[sIdx] || 'Benar'
              }));
            } else if (type === 'MENJODOHKAN') {
              const keyList = keyRaw.split(/[;]/).map(s => s.trim()).filter(Boolean);
              const pairItems = rawOpts.length > 0 ? rawOpts : [{ raw: 'Premis 1 -> Pasangan 1' }, { raw: 'Premis 2 -> Pasangan 2' }];
              newQ.pairs = pairItems.map((o, pIdx) => {
                const parts = o.raw.split(/->|=>|\|/);
                return {
                  id: 'P' + (pIdx + 1),
                  left: pxEsc((parts[0] || `Premis ${pIdx + 1}`).trim()),
                  right: (parts[1] || keyList[pIdx] || `Pasangan ${pIdx + 1}`).trim()
                };
              });
              newQ.distractorChoices = [...new Set([...newQ.pairs.map(p => p.right), 'Opsi Pengecoh'])];
            } else if (type === 'ISIAN') {
              const variants = keyRaw.split(/[;]/).map(s => s.trim()).filter(Boolean);
              newQ.correctText = variants[0] || keyRaw || '-';
              newQ.acceptedVariants = variants.length > 0 ? variants : [newQ.correctText];
            } else if (type === 'ESAI') {
              newQ.idealAnswer = keyRaw || 'Pedoman penilaian uraian.';
            }

            state.questions.push(newQ);
            importedCount++;
          });

          if (activePkg) syncPackageAcrossSystem(activePkg, { activateForStudents: false, silent: true });
          pxSaveImmediate();
          renderApp();
          showToast('Impor Bank Soal (.xls) Selesai', `${importedCount} butir soal berhasil ditambahkan.`, 'success');
        } catch (err) {
          showToast('Gagal Impor Soal Excel', 'Periksa format kolom sesuai template_bank_soal_cbt.xls.', 'danger');
        }
        e.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    }

    function exportBankSoalJSON() {
      const teacherAcc = getCurrentTeacherAccount();
      const activePkg = getActiveTeacherPackage(teacherAcc);
      const myQ = getTeacherQuestions(teacherAcc);
      const letters = ['A', 'B', 'C', 'D', 'E'];

      const payload = myQ.map(q => {
        const opts = Array.isArray(q.options) ? q.options.map(o => stripHtmlTags(o.text)) : [];
        const cIdx = Math.max(0, letters.indexOf((q.correctKey || 'A').toUpperCase()));
        return {
          id: q.id,
          type: (q.type || 'PG').toLowerCase(),
          kd: q.atp || q.element || '',
          atpKode: (q.atp || '').split('•')[0].trim() || 'ATP-XI.HE.1',
          topik: q.topic || activePkg.topic || '',
          levelKognitif: q.levelKognitif || (q.cognitive === 'L3' ? 'HOTS & Analisis' : (q.cognitive === 'L1' ? 'Dasar' : 'Menengah')),
          tp: q.cp || q.tp || '',
          indikator: q.atp || '',
          prompt: stripHtmlTags(q.formattedPrompt).trim(),
          options: opts,
          correctIndex: cIdx,
          points: Number(q.weight || 2)
        };
      });

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `bank_soal_${activePkg.id}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Ekspor Bank Soal (.json) Berhasil', `${payload.length} butir soal diunduh dalam format JSON.`, 'success');
    }

    function importBankSoalJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          let rawText = String(ev.target.result || '').trim();
          let items = null;

          try {
            const parsed = JSON.parse(rawText);
            items = Array.isArray(parsed) ? parsed : (parsed.questions || parsed.soal || []);
          } catch (parseErr) {
            // Pemulihan otomatis jika berkas JSON array terpotong di tengah objek terakhir
            const lastCompleteObjIdx = rawText.lastIndexOf('},');
            if (rawText.startsWith('[') && lastCompleteObjIdx > 0) {
              items = JSON.parse(rawText.slice(0, lastCompleteObjIdx + 1) + ']');
            } else {
              throw parseErr;
            }
          }

          if (!Array.isArray(items) || items.length === 0) {
            throw new Error('Array soal kosong');
          }

          const teacherAcc = getCurrentTeacherAccount();
          const activePkg = getActiveTeacherPackage(teacherAcc);
          const letters = ['A', 'B', 'C', 'D', 'E'];
          let addedCount = 0;
          let updatedCount = 0;

          items.forEach((item, idx) => {
            if (!item || !item.prompt) return;
            const qId = String(item.id || `JSON_${Date.now().toString().slice(-4)}_${idx + 1}`).trim();
            const rawOpts = Array.isArray(item.options) ? item.options : [];
            const mappedOpts = rawOpts.slice(0, 5).map((optText, oIdx) => ({
              key: letters[oIdx] || String.fromCharCode(65 + oIdx),
              text: pxEsc(String(optText))
            }));

            const cIdx = Number.isInteger(item.correctIndex) && item.correctIndex >= 0 && item.correctIndex < mappedOpts.length
              ? item.correctIndex
              : 0;
            const correctKey = letters[cIdx] || 'A';
            const lvl = String(item.levelKognitif || 'Menengah').trim();
            const cog = /hots|analisis/i.test(lvl) ? 'L3' : (/dasar/i.test(lvl) ? 'L1' : 'L2');

            const existing = state.questions.find(q => q.id === qId && q.packageId === activePkg.id);
            const targetObj = existing || {
              id: qId,
              number: state.questions.length + 1,
              packageId: activePkg.id,
              ownerId: teacherAcc ? teacherAcc.id : 'GUR-01',
              ownerName: teacherAcc ? teacherAcc.name : state.examConfig.teacher,
              subject: activePkg.subject,
              grade: activePkg.grade
            };

            // Bentuk soal: pg (default), pg_kompleks, benar_salah, menjodohkan, isian, esai
            const typeRaw = String(item.type || 'pg').trim().toLowerCase().replace(/[\s-]+/g, '_');
            const stmtsIn = Array.isArray(item.statements) ? item.statements.filter(x => x && x.text) : [];
            const pairsIn = Array.isArray(item.pairs) ? item.pairs.filter(x => x && x.left && x.right) : [];
            let qType = 'PG';
            if (/kompleks/.test(typeRaw) && mappedOpts.length >= 2) qType = 'PG_KOMPLEKS';
            else if (/benar|salah|^bs$/.test(typeRaw) && stmtsIn.length > 0) qType = 'BENAR_SALAH';
            else if (/jodoh/.test(typeRaw) && pairsIn.length > 0) qType = 'MENJODOHKAN';
            else if (/isian/.test(typeRaw) && (item.correctText || item.answer)) qType = 'ISIAN';
            else if (/esai|uraian/.test(typeRaw)) qType = 'ESAI';
            const importTypeLabels = { PG: 'Pilihan Ganda', PG_KOMPLEKS: 'Pilihan Ganda Kompleks', BENAR_SALAH: 'Benar / Salah Majemuk', MENJODOHKAN: 'Menjodohkan', ISIAN: 'Isian Singkat', ESAI: 'Uraian / Esai' };
            const typeFields = {};
            if (qType === 'PG') {
              typeFields.options = mappedOpts.length >= 2 ? mappedOpts : [{ key: 'A', text: 'Opsi A' }, { key: 'B', text: 'Opsi B' }];
              typeFields.correctKey = correctKey;
            } else if (qType === 'PG_KOMPLEKS') {
              const idxList = Array.isArray(item.correctIndexes) ? item.correctIndexes : [cIdx];
              typeFields.options = mappedOpts;
              typeFields.correctKeys = idxList.filter(n => Number.isInteger(n) && n >= 0 && n < mappedOpts.length).map(n => letters[n]);
            } else if (qType === 'BENAR_SALAH') {
              typeFields.statements = stmtsIn.map((st, sIdx) => ({
                id: 'S' + (sIdx + 1),
                text: pxEsc(String(st.text).trim()),
                answer: /^(salah|s|false|f)$/i.test(String(st.answer || '').trim()) ? 'Salah' : 'Benar'
              }));
            } else if (qType === 'MENJODOHKAN') {
              typeFields.pairs = pairsIn.map((pr, pIdx) => ({
                id: 'P' + (pIdx + 1),
                left: pxEsc(String(pr.left).trim()),
                right: String(pr.right).trim()
              }));
              const extraChoices = Array.isArray(item.distractorChoices) ? item.distractorChoices.map(x => String(x).trim()).filter(Boolean) : [];
              typeFields.distractorChoices = [...new Set([...extraChoices, ...typeFields.pairs.map(x => x.right)])];
            } else if (qType === 'ISIAN') {
              const variants = (Array.isArray(item.acceptedVariants) && item.acceptedVariants.length ? item.acceptedVariants : [item.correctText || item.answer]).map(x => String(x).trim()).filter(Boolean);
              typeFields.correctText = variants[0];
              typeFields.acceptedVariants = variants;
            } else if (qType === 'ESAI') {
              typeFields.idealAnswer = String(item.idealAnswer || item.answer || 'Pedoman penilaian uraian.').trim();
            }
            if (existing) {
              ['options', 'correctKey', 'correctKeys', 'statements', 'pairs', 'distractorChoices', 'correctText', 'acceptedVariants', 'idealAnswer'].forEach(k => { delete targetObj[k]; });
            }

            Object.assign(targetObj, {
              element: String(item.kd || 'LD — Literasi Digital (Hukum & Etika Digital)').trim(),
              topic: String(item.topik || activePkg.topic || 'Materi Informatika').trim(),
              cp: String(item.tp || activePkg.cp || '').trim(),
              atp: String(item.indikator || item.kd || activePkg.atp || '').trim(),
              tp: String(item.atpKode || item.tp || '').trim(),
              levelKognitif: lvl,
              cognitive: cog,
              type: qType,
              typeLabel: importTypeLabels[qType],
              weight: Math.max(1, Number(item.points || 2) || 2),
              included: true,
              formattedPrompt: `<p>${pxEsc(String(item.prompt).trim())}</p>`,
              ...typeFields
            });

            if (existing) {
              updatedCount++;
            } else {
              state.questions.push(targetObj);
              addedCount++;
            }
          });

          const totalInPkg = getQuestionsForPackage(activePkg).length;
          if (totalInPkg > activePkg.targetQuestionCount) {
            activePkg.targetQuestionCount = totalInPkg;
          }

          syncPackageAcrossSystem(activePkg, { activateForStudents: false, silent: true });
          pxLog('Impor Bank Soal JSON (.json)', file.name, `${addedCount} baru, ${updatedCount} diperbarui`, null);
          pxSaveImmediate();
          renderApp();
          showToast('Impor Bank Soal (.json) Berhasil', `${addedCount} butir soal ditambahkan, ${updatedCount} butir diperbarui.`, 'success');
        } catch (err) {
          showToast('Gagal Impor Soal JSON', 'Pastikan berkas JSON memuat array objek soal yang valid.', 'danger');
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    }

    function renderSiswaExamRoom() {
      const ss = state.studentSession;
      const st = getActiveStudent();
      const orderedQuestions = getOrderedQuestionsForStudent();
      const totalQ = orderedQuestions.length;
      const idx = Math.min(Math.max(0, ss.currentQuestionIndex), totalQ - 1);
      ss.currentQuestionIndex = idx;
      st.lastQuestionIndex = idx;
      const q = orderedQuestions[idx];
      const currentAns = ss.answers[q.id];
      const hasCurrentAns = pxHas(currentAns);
      const isFlagged = !!ss.flagged[q.id];
      const isCriticalTime = ss.remainingSeconds <= 300;

      const answeredCount = orderedQuestions.filter(item => pxHas(ss.answers[item.id])).length;
      const flaggedCount = Object.values(ss.flagged).filter(Boolean).length;
      const unansweredCount = Math.max(0, totalQ - answeredCount);
      const fontCls = ss.fontSize === 'sm' ? 'text-sm leading-relaxed' : (ss.fontSize === 'lg' ? 'text-lg leading-loose' : 'text-[15px] leading-[1.75]');
      const activeBanner = state.banners.find(b => b.room === st.room && b.id !== ss.dismissedBanner);
      const hasStimulus = Boolean(q.stimulusHtml || q.hasAudioStimulus);

      const filteredNavItems = orderedQuestions.map((item, i) => ({ item, i })).filter(({ item }) => {
        if (ss.navFilter === 'ANSWERED') return pxHas(ss.answers[item.id]);
        if (ss.navFilter === 'UNANSWERED') return !pxHas(ss.answers[item.id]);
        if (ss.navFilter === 'FLAGGED') return !!ss.flagged[item.id];
        return true;
      });

      const navigatorInnerHtml = `

              class="py-1 rounded transition ${ss.navFilter === 'ALL' ? 'bg-[#1E3A5F] text-white' : 'text-slate-700'}">
              Semua
            </button>
            <button type="button" onclick="state.studentSession.navFilter='ANSWERED'; renderApp();"
              class="py-1 rounded transition ${ss.navFilter === 'ANSWERED' ? 'bg-[#1E3A5F] text-white' : 'text-slate-700'}">
              Isi (${answeredCount})
            </button>
            <button type="button" onclick="state.studentSession.navFilter='FLAGGED'; renderApp();"
              class="py-1 rounded transition ${ss.navFilter === 'FLAGGED' ? 'bg-amber-700 text-white' : 'text-slate-700'}">

            <button type="button" onclick="state.studentSession.navFilter='UNANSWERED'; renderApp();"
              class="py-1 rounded transition ${ss.navFilter === 'UNANSWERED' ? 'bg-slate-700 text-white' : 'text-slate-700'}">
              Kosong
            </button>
          </div>

          <div class="grid grid-cols-5 gap-2">
            ${filteredNavItems.length > 0 ? filteredNavItems.map(({ item, i }) => {
              const isAnswered = pxHas(ss.answers[item.id]);
              const isFl = !!ss.flagged[item.id];
              const isCurr = i === idx;
              const cls = ['matrix-btn', isAnswered ? 'answered' : '', isFl ? 'flagged' : '', isCurr ? 'active' : ''].join(' ');
              return `<button type="button" onclick="goToQuestion(${i}); toggleMobileQuestionDrawer(false);" class="${cls}">${i + 1}</button>`;
            }).join('') : `<div class="col-span-5 py-6 text-center text-xs text-slate-400">Tidak ada nomor soal.</div>`}

            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-xs bg-amber-700 inline-block"></span> Ragu</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-xs border border-slate-400 bg-white inline-block"></span> Kosong (${unansweredCount})</span>

    function renderAudioStimulusBox(q) {
      const ss = state.studentSession;
      const played = ss.audioPlayCountByQ[q.id] || 0;
      const maxPlays = q.audioMaxPlays || 2;
      const isPlaying = ss.audioPlayingQId === q.id;

      return `
        <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-300 space-y-2.5">
          <div class="flex items-center justify-between gap-2 text-xs">
            <span class="font-semibold text-[#1E3A5F] flex items-center gap-1.5">
              <i data-lucide="volume-2" class="w-4 h-4"></i> Stimulus Audio
            </span>
            <span class="font-mono-code font-semibold text-slate-700">${played}/${maxPlays}x</span>
          </div>
          <div class="flex items-center gap-3">
            <button type="button" onclick="playExamAudio('${q.id}')" ${isPlaying || played >= maxPlays ? 'disabled' : ''}
              class="px-3.5 py-1.5 rounded-lg btn-sapphire disabled:opacity-40 text-white text-xs font-semibold flex items-center gap-1.5 shrink-0">
              <i data-lucide="${isPlaying ? 'loader' : 'play'}" class="w-3.5 h-3.5"></i>
              <span>${isPlaying ? 'Memutar...' : (played >= maxPlays ? 'Batas Habis' : 'Putar')}</span>
            </button>
            <div class="flex-1 h-2 rounded-full bg-slate-200 overflow-hidden">
              <div class="h-full bg-[#1E3A5F] transition-all" style="width:${isPlaying ? ss.audioProgressPct : 0}%"></div>
            </div>
          </div>
          ${isPlaying ? `<div class="p-2.5 rounded-lg bg-white border border-slate-200 text-xs text-slate-600 italic leading-relaxed">"${pxEsc(q.audioTranscript)}"</div>` : ''}
        </div>
      `;
    }

    function renderQuestionAnswerInput(q, currentAns) {
      if (q.type === 'PG') {
        const opts = getOrderedOptionsForQuestion(q);
        return `
          <div class="space-y-2">
            ${opts.map((opt, idx) => {
              const displayLetter = ['A', 'B', 'C', 'D', 'E'][idx] || opt.key;
              const isSelected = currentAns === opt.key;
              return `
                <button type="button" onclick="selectSingleOption('${q.id}', '${opt.key}')"
                  class="studio-option ${isSelected ? 'selected' : ''}">
                  <span class="studio-option-key">${displayLetter}</span>
                  <div class="text-sm text-slate-800 pt-0.5 leading-relaxed">${opt.text}</div>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      if (q.type === 'PG_KOMPLEKS') {
        const selectedArr = Array.isArray(currentAns) ? currentAns : [];
        return `
          <div class="space-y-2">
            <div class="text-xs font-medium text-slate-500">Pilih lebih dari satu pernyataan yang benar:</div>
            ${q.options.map(opt => {
              const checked = selectedArr.includes(opt.key);
              return `
                <button type="button" onclick="toggleMultiOption('${q.id}', '${opt.key}')"
                  class="studio-option ${checked ? 'selected' : ''}">
                  <input type="checkbox" ${checked ? 'checked' : ''} class="pointer-events-none mt-1 w-4 h-4 rounded accent-[#1E3A5F] shrink-0">
                  <div class="text-sm text-slate-800 leading-relaxed">${opt.text}</div>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      if (q.type === 'BENAR_SALAH') {
        const ansObj = (currentAns && typeof currentAns === 'object') ? currentAns : {};
        return `
          <div class="table-scroll-wrap border border-slate-300 rounded-xl">
            <table class="cbt-table text-xs sm:text-sm">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-300 font-semibold text-slate-700">
                  <th class="min-w-[220px]">Pernyataan</th>
                  <th class="text-center w-20">Benar</th>
                  <th class="text-center w-20">Salah</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${q.statements.map(st => `
                  <tr class="hover:bg-slate-50/60">
                    <td class="text-slate-800 leading-relaxed">${st.text}</td>
                    <td class="text-center">
                      <input type="radio" name="bs_${q.id}_${st.id}" ${ansObj[st.id] === 'Benar' ? 'checked' : ''}
                        onchange="setStatementAnswer('${q.id}', '${st.id}', 'Benar')" class="w-4 h-4 cursor-pointer accent-[#1E3A5F]">
                    </td>
                    <td class="text-center">
                      <input type="radio" name="bs_${q.id}_${st.id}" ${ansObj[st.id] === 'Salah' ? 'checked' : ''}
                        onchange="setStatementAnswer('${q.id}', '${st.id}', 'Salah')" class="w-4 h-4 cursor-pointer accent-[#1E3A5F]">
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      if (q.type === 'MENJODOHKAN') {
        const ansObj = (currentAns && typeof currentAns === 'object') ? currentAns : {};
        const choices = q.distractorChoices || q.pairs.map(p => p.right);
        return `
          <div class="space-y-2.5">
            ${q.pairs.map(pr => `
              <div class="p-3.5 rounded-xl border border-slate-300 bg-slate-50/70 grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
                <div class="sm:col-span-7 text-xs sm:text-sm font-medium text-slate-800">${pr.left}</div>
                <div class="sm:col-span-5">
                  <select onchange="setMatchingAnswer('${q.id}', '${pr.id}', this.value)"
                    class="w-full p-2.5 rounded-lg border border-slate-300 bg-white text-xs sm:text-sm font-semibold text-slate-900">
                    <option value="">-- Pilih Pasangan --</option>
                    ${choices.map(ch => `<option value="${pxEsc(ch)}" ${ansObj[pr.id] === ch ? 'selected' : ''}>${pxEsc(ch)}</option>`).join('')}
                  </select>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      if (q.type === 'ISIAN') {
        return `
          <div class="max-w-sm space-y-1.5">
            <label class="block text-xs font-semibold text-slate-600">Jawaban Singkat:</label>
            <input type="text" value="${pxEsc(currentAns || '')}"
              oninput="saveTextAnswer('${q.id}', this.value)"
              placeholder="Ketik angka / jawaban..."
              class="w-full p-3 rounded-lg border border-slate-300 bg-white font-mono-code font-bold text-base focus:border-[#1E3A5F] outline-none">
          </div>
        `;
      }

      if (q.type === 'ESAI') {
        return `
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-slate-600">Jawaban Uraian / Kode Python:</label>
            <textarea rows="6" oninput="saveTextAnswer('${q.id}', this.value)"
              placeholder="Tuliskan analisis bug dan perbaikan kode Python..."
              class="w-full p-3.5 rounded-xl border border-slate-300 bg-white font-mono-code text-xs sm:text-sm leading-relaxed focus:border-[#1E3A5F] outline-none">${pxEsc(currentAns || '')}</textarea>
          </div>
        `;
      }

      return '';
    }

    function renderGuruBankSoal() {
      const teacherAcc = getCurrentTeacherAccount();
      const activePkg = getActiveTeacherPackage(teacherAcc);
      const myQuestions = getTeacherQuestions(teacherAcc);
      const searchQ = (state.bankFilter.search || '').toLowerCase().trim();

      const filtered = myQuestions.filter(q => {
        if (state.bankFilter.element !== 'ALL' && q.element !== state.bankFilter.element) return false;
        if (state.bankFilter.topic !== 'ALL' && (q.topic || '') !== state.bankFilter.topic) return false;
        if (state.bankFilter.type !== 'ALL' && q.type !== state.bankFilter.type) return false;
        if (searchQ) {
          const hay = `${q.id} ${q.topic || ''} ${q.cp || ''} ${q.atp || ''} ${q.tp || ''} ${q.element || ''} ${stripHtmlTags(q.formattedPrompt)}`.toLowerCase();
          if (!hay.includes(searchQ)) return false;
        }
        return true;
      });

      const uniqueElements = [...new Set(myQuestions.map(q => q.element).filter(Boolean))];
      const uniqueTopics = [...new Set(myQuestions.map(q => q.topic).filter(Boolean))];
      const readiness = getPackageReadiness(activePkg);
      const remainingToCreate = Math.max(0, readiness.targetCount - readiness.activeCount);

      const elCounts = {};
      myQuestions.filter(q => q.included).forEach(q => {
        const code = (q.element || 'Lainnya').split('—')[0].trim();
        elCounts[code] = (elCounts[code] || 0) + 1;
      });

      return `

            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">

                <p class="text-xs text-slate-500">

                  Tersedia Aktif: <strong class="font-mono-code ${remainingToCreate === 0 ? 'text-emerald-700' : 'text-amber-700'}">${readiness.activeCount} Butir</strong>
                  ${remainingToCreate > 0 ? `(Kurang ${remainingToCreate} butir lagi)` : '(Target terpenuhi)'}
                </p>
              </div>

                <button type="button" onclick="downloadBankSoalXLSTemplate()" class="px-3 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold inline-flex items-center gap-1.5 whitespace-nowrap">

                </button>

              <select onchange="state.bankFilter.element=this.value; renderApp();" class="p-2.5 rounded-lg border border-slate-300 bg-white font-medium">
                <option value="ALL">Semua Elemen CP</option>
                ${uniqueElements.map(el => `<option value="${pxEsc(el)}" ${state.bankFilter.element === el ? 'selected' : ''}>${pxEsc(el)}</option>`).join('')}
              </select>
              <select onchange="state.bankFilter.type=this.value; renderApp();" class="p-2.5 rounded-lg border border-slate-300 bg-white font-medium">
                <option value="ALL">Semua Bentuk Soal</option>

                    <span class="px-2.5 py-0.5 rounded-md font-medium ${getElementBadgeClass()}">${pxEsc(q.element)}</span>
                    ${q.levelKognitif ? `<span class="px-2.5 py-0.5 rounded-md bg-amber-50 text-amber-900 border border-amber-200 font-semibold whitespace-nowrap">${pxEsc(q.levelKognitif)}</span>` : ''}
                    ${q.topic ? `<span class="px-2.5 py-0.5 rounded-md bg-blue-50 text-[#1E3A5F] border border-blue-200 font-semibold">Topik: ${pxEsc(q.topic)}</span>` : ''}
                    ${q.validated ? `<span class="px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-800 border border-emerald-300 font-semibold inline-flex items-center gap-1 whitespace-nowrap"><i data-lucide="badge-check" class="w-3 h-3"></i> Tervalidasi</span>` : ''}

                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
